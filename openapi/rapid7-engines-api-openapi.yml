openapi: 3.2.0
info:
  title: InsightAppSec Engines API
  description: Welcome to the reference documentation for the public APIs available for InsightAppSec.
  version: v1
servers:
- url: https://[region].api.insight.rapid7.com/ias/v1
tags:
- name: Engines
  description: An Engine encapsulates the state and high-level attributes of the components which may be installed and running on a specific On-Premise host.
paths:
  /engines:
    get:
      tags:
      - Engines
      summary: Get Engines
      description: 'Get a page of Engines, based on supplied pagination parameters.

        The default sort for Engines is "name" (ascending); for a full list of sortable properties, refer to the Search Catalog detailed in the Search API.'
      operationId: get-engines
      parameters:
      - name: pageConfig
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/LuxorPageable'
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEngine'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Engines
      summary: Create Engine
      description: Create a new Engine.
      operationId: create-engine
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Engine'
        required: true
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
