  /engines/{engine-id}/upgrade:
    post:
      tags:
      - Engines
      summary: Upgrade Engine
      description: Upgrade an Engine. In order to upgrade the engine must be in IDLE state and not have latest version.
      operationId: upgrade-engine
      parameters:
      - name: engine-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
