openapi: 3.2.0
info:
  title: InsightAppSec Vulnerabilities API
  description: Welcome to the reference documentation for the public APIs available for InsightAppSec.
  version: v1
servers:
- url: https://[region].api.insight.rapid7.com/ias/v1
tags:
- name: Vulnerabilities
  description: A Vulnerability is a resource that encapsulates any information found by any Scan over the lifetime of an App, that may identify where and how an App could be exploited.
paths:
  /modules:
    get:
      tags:
      - Vulnerabilities
      summary: Get Modules
      description: Get the metadata of all modules
      operationId: get-modules
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleMetadata'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /modules/{module-id}:
    get:
      tags:
      - Vulnerabilities
      summary: Get Module
      description: Get the metadata of a module
      operationId: get-module
      parameters:
      - name: module-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleMetadata'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /modules/{module-id}/attacks/{attack-id}:
    get:
      tags:
      - Vulnerabilities
      summary: Get Attack
      description: Get the metadata of an attack
      operationId: get-attack
      parameters:
      - name: module-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attack-id
        in: path
        required: true
        schema:
          type: string
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttackMetadata'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /modules/{module-id}/attacks/{attack-id}/documentation:
    get:
      tags:
      - Vulnerabilities
      summary: Get Attack Documentation
      description: Get the documentation of an attack
      operationId: get-attack-documentation
      parameters:
      - name: module-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attack-id
        in: path
        required: true
        schema:
          type: string
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttackDocumentation'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vulnerabilities:
    get:
      tags:
      - Vulnerabilities
      summary: Get Vulnerabilities
      description: 'Get a page of Vulnerabilities, based on supplied pagination parameters.

        The default sort for Vulnerabilities is "severity" (descending); for a full list of sortable properties, refer to the Search Catalog detailed in the Search API.'
      operationId: get-vulnerabilities
      parameters:
      - name: index
        in: query
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        schema:
          type: string
      - name: page-token
        in: query
        schema:
          type: string
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageVulnerability'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vulnerabilities/{vuln-id}:
    get:
      tags:
      - Vulnerabilities
      summary: Get Vulnerability
      description: Get a Vulnerability
      operationId: get-vulnerability
      parameters:
      - name: vuln-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityModelVulnerability'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Vulnerabilities
      summary: Update Vulnerability
      description: Update a Vulnerability
      operationId: update-vulnerability
      parameters:
      - name: vuln-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vulnerability'
        required: true
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Action conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Resource validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
  /vulnerabilities/{vuln-id}/discoveries:
    get:
      tags:
      - Vulnerabilities
      summary: Get Vulnerability Discoveries
      description: 'Get a page of Vulnerability Discoveries, based on supplied pagination parameters.

        The default sort for Vulnerability Discoveries is "discovered" (descending)'
      operationId: get-vulnerability-discoveries
      parameters:
      - name: vuln-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: index
        in: query
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        schema:
          type: string
      - name: page-token
        in: query
        schema:
          type: string
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageVulnerabilityDiscovery'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vulnerabilities/{vuln-id}/discoveries/{vuln-discovery-id}:
    get:
      tags:
      - Vulnerabilities
      summary: Get Vulnerability Discovery
      description: Get a Vulnerability Discovery
      operationId: get-vulnerability-discovery
      parameters:
      - name: vuln-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: vuln-discovery-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityModelVulnerabilityDiscovery'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    PageVulnerabilityDiscovery:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EntityModelVulnerabilityDiscovery'
        metadata:
          $ref: '#/components/schemas/PageMetadata'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
    EntityModelVulnerability:
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the Vulnerability
          readOnly: true
        app:
          $ref: '#/components/schemas/ReadOnlyIdResource'
        root_cause:
          $ref: '#/components/schemas/RootCause'
        severity:
          type: string
          description: The severity of the Vulnerability
          enum:
          - SAFE
          - INFORMATIONAL
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        status:
          type: string
          description: The status of the Vulnerability
          enum:
          - UNREVIEWED
          - FALSE_POSITIVE
          - VERIFIED
          - IGNORED
          - REMEDIATED
          - DUPLICATE
        first_discovered:
          type: string
          description: The time the Vulnerability was first discovered
          example: '2021-08-03T14:07:37'
          readOnly: true
        last_discovered:
          type: string
          description: The time the Vulnerability was last discovered
          example: '2021-08-03T14:07:37'
          readOnly: true
        newly_discovered:
          type: boolean
          description: 'Indicates that the vulnerability has been found in the latest scan and has not been discovered before '
          readOnly: true
        variances:
          type: array
          description: Evidence found that indicates the presence of a Vulnerability
          items:
            $ref: '#/components/schemas/Variance'
          readOnly: true
        vector_string:
          type: string
          description: Textual representation of the metric values used to determine the CVSS score
          readOnly: true
        vulnerability_score:
          type: number
          format: double
          description: CVSS score which represents the severity of an information security vulnerability
          readOnly: true
        insight_ui_url:
          type: string
          description: Direct link to the Vulnerability on InsightAppSec UI. <b>Require InsightAppSec login before use.<b>
          readOnly: true
        updated_time:
          type: string
          format: date-time
          description: ${public-api.docs.models.vulnerability.properties.updated-time}
          readOnly: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
    RootCause:
      description: A descriptor for the location of the Vulnerability
      properties:
        url:
          type: string
          description: The URL
          readOnly: true
        parameter:
          type: string
          description: The parameter from the URL
          readOnly: true
        method:
          type: string
          description: The HTTP method
          readOnly: true
      readOnly: true
      title: RootCause
    ValidationError:
      properties:
        type:
          type: string
          description: The type of the validation error
          enum:
          - OBJECT
          - PROPERTY
          readOnly: true
        context:
          type: string
          description: An optional contextual indicator of a part of the request which failed validation
          readOnly: true
        explanation:
          type: string
          description: Details of the validation error
          readOnly: true
    Vulnerability:
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the Vulnerability
          readOnly: true
        app:
          $ref: '#/components/schemas/ReadOnlyIdResource'
        root_cause:
          $ref: '#/components/schemas/RootCause'
        severity:
          type: string
          description: The severity of the Vulnerability
          enum:
          - SAFE
          - INFORMATIONAL
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        status:
          type: string
          description: The status of the Vulnerability
          enum:
          - UNREVIEWED
          - FALSE_POSITIVE
          - VERIFIED
          - IGNORED
          - REMEDIATED
          - DUPLICATE
        first_discovered:
          type: string
          description: The time the Vulnerability was first discovered
          example: '2021-08-03T14:07:37'
          readOnly: true
        last_discovered:
          type: string
          description: The time the Vulnerability was last discovered
          example: '2021-08-03T14:07:37'
          readOnly: true
        newly_discovered:
          type: boolean
          description: 'Indicates that the vulnerability has been found in the latest scan and has not been discovered before '
          readOnly: true
        variances:
          type: array
          description: Evidence found that indicates the presence of a Vulnerability
          items:
            $ref: '#/components/schemas/Variance'
          readOnly: true
        vector_string:
          type: string
          description: Textual representation of the metric values used to determine the CVSS score
          readOnly: true
        vulnerability_score:
          type: number
          format: double
          description: CVSS score which represents the severity of an information security vulnerability
          readOnly: true
        insight_ui_url:
          type: string
          description: Direct link to the Vulnerability on InsightAppSec UI. <b>Require InsightAppSec login before use.<b>
          readOnly: true
        updated_time:
          type: string
          format: date-time
          description: ${public-api.docs.models.vulnerability.properties.updated-time}
          readOnly: true
      title: Vulnerability
    EntityModelVulnerabilityDiscovery:
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the Vulnerability Discovery
          readOnly: true
        vulnerability:
          $ref: '#/components/schemas/ReadOnlyIdResource'
        scan:
          $ref: '#/components/schemas/ReadOnlyIdResource'
        discovered:
          type: string
          description: The time the Vulnerability Discovery was discovered
          example: '2021-08-03T14:07:37'
          readOnly: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
    PageVulnerability:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EntityModelVulnerability'
        metadata:
          $ref: '#/components/schemas/PageMetadata'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
    PageMetadata:
      properties:
        index:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        sort:
          type: string
        total_data:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
        page_token:
          type: string
    StringReferenceResource:
      description: The ID of the attack
      properties:
        id:
          type: string
      readOnly: true
    Link:
      properties:
        rel:
          type: string
        href:
          type: string
        profile:
          type: string
        name:
          type: string
      readOnly: true
    AttackMetadata:
      properties:
        id:
          type: string
          description: The ID of the attack
          readOnly: true
        type:
          type: string
          description: The type of the attack
          readOnly: true
        class:
          type: string
          description: The class of the attack
          readOnly: true
        description:
          type: string
          description: The description of the attack
          readOnly: true
      title: AttackMetadata
    Error:
      properties:
        status:
          type: string
          description: A description of the type of error based on HTTP status code
          enum:
          - 100 CONTINUE
          - 101 SWITCHING_PROTOCOLS
          - 102 PROCESSING
          - 103 EARLY_HINTS
          - 103 CHECKPOINT
          - 200 OK
          - 201 CREATED
          - 202 ACCEPTED
          - 203 NON_AUTHORITATIVE_INFORMATION
          - 204 NO_CONTENT
          - 205 RESET_CONTENT
          - 206 PARTIAL_CONTENT
          - 207 MULTI_STATUS
          - 208 ALREADY_REPORTED
          - 226 IM_USED
          - 300 MULTIPLE_CHOICES
          - 301 MOVED_PERMANENTLY
          - 302 FOUND
          - 302 MOVED_TEMPORARILY
          - 303 SEE_OTHER
          - 304 NOT_MODIFIED
          - 305 USE_PROXY
          - 307 TEMPORARY_REDIRECT
          - 308 PERMANENT_REDIRECT
          - 400 BAD_REQUEST
          - 401 UNAUTHORIZED
          - 402 PAYMENT_REQUIRED
          - 403 FORBIDDEN
          - 404 NOT_FOUND
          - 405 METHOD_NOT_ALLOWED
          - 406 NOT_ACCEPTABLE
          - 407 PROXY_AUTHENTICATION_REQUIRED
          - 408 REQUEST_TIMEOUT
          - 409 CONFLICT
          - 410 GONE
          - 411 LENGTH_REQUIRED
          - 412 PRECONDITION_FAILED
          - 413 PAYLOAD_TOO_LARGE
          - 413 REQUEST_ENTITY_TOO_LARGE
          - 414 URI_TOO_LONG
          - 414 REQUEST_URI_TOO_LONG
          - 415 UNSUPPORTED_MEDIA_TYPE
          - 416 REQUESTED_RANGE_NOT_SATISFIABLE
          - 417 EXPECTATION_FAILED
          - 418 I_AM_A_TEAPOT
          - 419 INSUFFICIENT_SPACE_ON_RESOURCE
          - 420 METHOD_FAILURE
          - 421 DESTINATION_LOCKED
          - 422 UNPROCESSABLE_ENTITY
          - 423 LOCKED
          - 424 FAILED_DEPENDENCY
          - 425 TOO_EARLY
          - 426 UPGRADE_REQUIRED
          - 428 PRECONDITION_REQUIRED
          - 429 TOO_MANY_REQUESTS
          - 431 REQUEST_HEADER_FIELDS_TOO_LARGE
          - 451 UNAVAILABLE_FOR_LEGAL_REASONS
          - 500 INTERNAL_SERVER_ERROR
          - 501 NOT_IMPLEMENTED
          - 502 BAD_GATEWAY
          - 503 SERVICE_UNAVAILABLE
          - 504 GATEWAY_TIMEOUT
          - 505 HTTP_VERSION_NOT_SUPPORTED
          - 506 VARIANT_ALSO_NEGOTIATES
          - 507 INSUFFICIENT_STORAGE
          - 508 LOOP_DETECTED
          - 509 BANDWIDTH_LIMIT_EXCEEDED
          - 510 NOT_EXTENDED
          - 511 NETWORK_AUTHENTICATION_REQUIRED
          readOnly: true
        message:
          type: string
          description: A description of the error
          readOnly: true
        errorCode:
          type: string
          description: An optional code which may help support indicate the underlying cause of the error
          enum:
          - E1
          - E2
          - E3
          - E4
          - E5
          - E6
          - E7
          - E8
          - E9
          - E10
          - E11
          - E12
          - E13
          - E14
          - E15
          - E16
          - E17
          - E18
          - E19
          - E20
          - E22
          - E23
          - E24
          - E25
          - E26
          - E27
          - E28
          - E999
          readOnly: true
      title: Error
    ValidationErrors:
      properties:
        status:
          type: string
          description: A description of the type of error based on HTTP status code
          enum:
          - 100 CONTINUE
          - 101 SWITCHING_PROTOCOLS
          - 102 PROCESSING
          - 103 EARLY_HINTS
          - 103 CHECKPOINT
          - 200 OK
          - 201 CREATED
          - 202 ACCEPTED
          - 203 NON_AUTHORITATIVE_INFORMATION
          - 204 NO_CONTENT
          - 205 RESET_CONTENT
          - 206 PARTIAL_CONTENT
          - 207 MULTI_STATUS
          - 208 ALREADY_REPORTED
          - 226 IM_USED
          - 300 MULTIPLE_CHOICES
          - 301 MOVED_PERMANENTLY
          - 302 FOUND
          - 302 MOVED_TEMPORARILY
          - 303 SEE_OTHER
          - 304 NOT_MODIFIED
          - 305 USE_PROXY
          - 307 TEMPORARY_REDIRECT
          - 308 PERMANENT_REDIRECT
          - 400 BAD_REQUEST
          - 401 UNAUTHORIZED
