openapi: 3.2.0
info:
  title: InsightIDR Health Metrics API
  version: v1
  description: 'Introduction


    Welcome to the reference documentation for the InsightIDR public APIs.


    Here are a few resources to help you learn how to start using our APIs:


    Learn about basic concepts and capabilities


    Get an Insight platform API key to set up authentication


    See available Insight product APIs


    Learn more about InsightIDR


    After you''ve got the basics down, you can use this API guide to find examples of requests and responses.'
servers:
- url: https://{region}.api.insight.rapid7.com/
  variables:
    region:
      default: us
      description: Insight API region
security: []
tags:
- name: Health Metrics
  description: An API used to retrieve health metrics of an organization.
paths:
  /idr/v1/health-metrics:
    get:
      tags:
      - Health Metrics
      summary: Retrieve health metrics by org
      description: Retrieve paginated health metrics for the given org. In the event of a 207 response, there may be two additional metadata fields in the response. 'failed_to_load' contains the the resource types that did not successfully load. 'unlicensed_resource_types' contains resource types that were requested, but for which the org does not have access to.
      operationId: getMetrics
      parameters:
      - name: index
        in: query
        description: The optional, 0 based index of the page to retrieve.  Must be an integer greater than or equal to 0.
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
        example: 0
      - name: size
        in: query
        description: The optional size of the page to retrieve. Must be an integer greater than 0 or less than or equal to 100.
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 20
        example: 20
      - name: resourceTypes
        in: query
        description: An optional, comma-separated set of resource types. Only resources whose type matches one of the entries in the list are returned. If this parameter is omitted, health metrics with any resource type may be returned.
        required: false
        schema:
          type: string
        example: agent,collectors
      - name: orgId
        in: query
        description: Optional organization ID to get metrics for. If not specified, metrics for the user's current organization will be returned. User must have access to the specified organization.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
              examples:
                Agent:
                  description: Health metrics for agent resources
                  value:
                    data:
                    - type: agent
                      rrn: rrn:rapid7:us:customer:12345:agent:678
                      offline: 5
                      online: 25
                      stale: 3
                      total: 33
                    metadata:
                      index: 0
                      size: 0
                      total_pages: 20
                      total_data: 0
                Collectors:
                  description: Health metrics for collector resources
                  value:
                    data:
                    - type: collectors
                      rrn: rrn:rapid7:us:customer:12345:collector:abc123
                      id: collector-001
                      name: Main Collector
                      state: RUNNING
                      last_active: '2025-09-18T10:30:00Z'
                      event_sources_used: 15
