openapi: 3.2.0
info:
  title: InsightAppSec Scan Configs API
  description: Welcome to the reference documentation for the public APIs available for InsightAppSec.
  version: v1
servers:
- url: https://[region].api.insight.rapid7.com/ias/v1
tags:
- name: Scan Configs
  description: A Scan Config defines all the necessary information required to perform a Scan of an App.
paths:
  /scan-configs:
    get:
      tags:
      - Scan Configs
      summary: Get Scan Configs
      description: 'Get a page of Scan Configs, based on supplied pagination parameters.

        The default sort for Scan Configs is "name" (ascending); for a full list of sortable properties, refer to the Search Catalog detailed in the Search API.


        By default, the errors property is populated and requires validation of each scan config''s options in order to do so; this can be expensive in a number of cases, such as options with a number of associated files or credentials, and requests with a large page size may suffer as a result. Including the include-errors=false request parameter will dramatically reduce response times for calls to this endpoint.'
      operationId: get-scan-configs
      parameters:
      - name: include-errors
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: index
        in: query
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        schema:
          type: string
      - name: page-token
        in: query
        schema:
          type: string
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageScanConfig'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Scan Configs
      summary: Create Scan Config
      description: Create a new Scan Config
      operationId: create-scan-config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanConfig'
        required: true
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Created
        '400':
          description: Bad Request
          content:
