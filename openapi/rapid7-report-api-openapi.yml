openapi: 3.2.0
info:
  description: '# Overview


    This guide documents the InsightVM Application Programming Interface (API) Version 3.'
  version: '3'
  title: InsightVM Report API
  contact:
    name: Rapid7
    email: support@rapid7.com
servers:
- url: https://localhost:3780/
tags:
- name: Report
  description: Resources and operations for managing and generating reports.
paths:
  /api/3/report_formats:
    get:
      tags:
      - Report
      summary: Report Formats
      description: Returns all available report formats. A report format indicates an output file format specification (e.g. PDF, XML, etc). Some printable formats may be templated, and others may not. The supported templates for each formated are provided.
      operationId: getReportFormats
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Resources_AvailableReportFormat'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/report_templates:
    get:
      tags:
      - Report
      summary: Report Templates
      description: Returns all available report templates.
      operationId: getReportTemplates
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Resources_ReportTemplate'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/report_templates/{id}:
    get:
      tags:
      - Report
      summary: Report Template
      description: Returns the details of a report template. Report templates govern the contents generated within a report.
      operationId: getReportTemplate
      parameters:
      - name: id
        in: path
        description: The identifier of the report template;
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ReportTemplate'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/reports:
    get:
      tags:
      - Report
      summary: Reports
      description: Returns all defined report configurations.
      operationId: getReports
      parameters:
      - name: page
        in: query
        description: The index of the page (zero-based) to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: The number of records per page to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sort
        in: query
        description: 'The criteria to sort the records by, in the format: `property[,ASC|DESC]`. The default sort order is ascending. Multiple sort criteria can be specified using multiple sort query parameters.'
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PageOf_Report'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
    post:
      tags:
      - Report
      summary: Reports
      description: Configures a new report for generation. Report types are controlled through either or both a format and template. Non-templatized (`export`) report formats do not require a template and have their output format preset. Templatized (`document` and `file`) report formats support a report template that governs the content of the output and the output format can be chosen from a list of supported formats.
      operationId: createReport
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/CreatedReference_int_Link'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
      x-code-samples:
      - lang: Nexpose™ Simple XML
        source: "{\n   \"format\": \"nexpose-simple-xml\",\n   \"name\": \"Scan Report for February scan\",\n   \"filters\": {\n      \"statuses\": [ \"vulnerable\", \"vulnerable-version\" ]\n   },\n   \"scope\": {\n      \"scan\": 2\n   }\n}"
      - lang: Qualys XML
        source: "{\n   \"format\": \"qualys-xml\",\n   \"name\": \"Qualys Export\",\n   \"filters\": {\n      \"severity\": \"critical-and-severe\",\n      \"categories\": {\n         \"included\": [ \"Adobe\" ]\n      }\n   },\n   \"scope\": {\n      \"sites\": [ 3 ]\n   }\n}"
      - lang: OVAL XML
        source: "{\n   \"format\": \"oval-xml\",\n   \"name\": \"OVAL XML\",\n   \"policy\": 32, \n   \"scope\": {\n      \"sites\": [ 17 ]\n   }\n}"
      - lang: XCCDF CSV
        source: "{\n   \"format\": \"xccdf-csv\",\n   \"name\": \"XCDDF CSV Report\",\n   \"policy\": 89,\n   \"scope\": {\n      \"assets\": [ 4, 7, 9, 22 ]\n   },\n   \"filters\": {\n      \"severity\": \"critical\"\n   },\n   \"frequency\": {\n      \"start\": \"2017-11-30\",\n      \"repeat\": {\n         \"every\": \"week\",\n         \"interval\": 2\n      }\n   }\n}"
      - lang: XCCDF XML
        source: "{\n   \"format\": \"xccdf-xml\",\n   \"name\": \"XCCDF XML\",\n   \"policy\": 12,\n   \"organization\": \"Acme Organization\",\n   \"scope\": {\n      \"tags\": [ 4 ]\n   },\n   \"filters\": {\n      \"severity\": \"critical\"\n   },\n   \"frequency\": {\n      \"start\": \"2018-11-30\",\n      \"repeat\": {\n         \"every\": \"date-of-month\",\n         \"interval\": 3,\n         \"dateOfMonth\": \"last\"\n      }\n   }\n}"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
        description: The specification of a report configuration.
  /api/3/reports/{id}:
    get:
      tags:
      - Report
      summary: Report
      description: Returns the configuration details of a report.
      operationId: getReport
      parameters:
      - name: id
        in: path
        description: The identifier of the report.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
    put:
      tags:
      - Report
      summary: Report
      description: Updates the configuration details of a report.
      operationId: updateReport
      parameters:
      - name: id
        in: path
        description: The identifier of the report.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Links'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
        description: The specification of a report configuration.
    delete:
      tags:
      - Report
      summary: Report
      description: Deletes the configuration of a report.
      operationId: deleteReport
      parameters:
      - name: id
        in: path
        description: The identifier of the report.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Links'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/reports/{id}/generate:
    post:
      tags:
      - Report
      summary: Report Generation
      description: Generates a configured report and returns the instance identifier of the report.
      operationId: generateReport
      parameters:
      - name: id
        in: path
        description: The identifier of the report.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ReferenceWithReportIDLink'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/reports/{id}/history:
    get:
      tags:
      - Report
      summary: Report Histories
      description: Returns all historical details for generation of the report over time.
      operationId: getReportInstances
      parameters:
      - name: id
        in: path
        description: The identifier of the report.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Resources_ReportInstance'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/reports/{id}/history/{instance}:
    get:
      tags:
      - Report
      summary: Report History
      description: Returns the details for a generation of the report.
      operationId: getReportInstance
      parameters:
      - name: id
        in: path
        description: The identifier of the report.
        required: true
        schema:
          type: integer
          format: int32
      - name: instance
        in: path
        description: The identifier of the report instance.
        required: true
        schema:
          type: string
          enum:
          - latest
          - integer <<int32>>
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ReportInstance'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
    delete:
      tags:
      - Report
      summary: Report History
      description: Deletes an instance of a generated report.
      operationId: deleteReportInstance
      parameters:
      - name: id
        in: path
        description: The identifier of the report.
        required: true
        schema:
          type: integer
          format: int32
      - name: instance
        in: path
        description: The identifier of the report instance.
        required: true
        schema:
          type: string
          enum:
          - latest
          - integer <<int32>>
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Links'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/reports/{id}/history/{instance}/output:
    get:
      tags:
      - Report
      summary: Report Download
      description: Returns the contents of a generated report. The report content is usually returned in a GZip compressed format.
      operationId: downloadReport
      parameters:
      - name: id
        in: path
        description: The identifier of the report.
        required: true
        schema:
          type: integer
          format: int32
      - name: instance
        in: path
        description: The identifier of the report instance.
        required: true
        schema:
          type: string
          enum:
          - latest
          - integer <<int32>>
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/octet-stream:
              schema:
                type: string
                format: byte
            application/json;charset=UTF-8:
              schema:
                type: string
                format: byte
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/NotFoundError'
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/InternalServerError'
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
components:
  schemas:
    ReportSize:
      type: object
      properties:
        bytes:
          type: integer
          format: int64
          example: 24789050
          description: The raw value in bytes.
        formatted:
          type: string
          example: 23.6 MB
          description: The value formatted in human-readable notation (e.g. GB, MB, KB, bytes).
      description: ''
    ReportConfigScopeResource:
      type: object
      properties:
        assetGroups:
          type: array
          description: Identifiers of the asset groups in the scope of the report.
          items:
            type: integer
            format: int32
        assets:
          type: array
          description: Identifiers of the assets in the scope of the report.
          items:
            type: integer
            format: int64
        scan:
          type: integer
          format: int64
          example: 68
          description: Identifiers of the scans in the scope of the report.
        sites:
          type: array
          description: Identifiers of the sites in the scope of the report.
          items:
            type: integer
            format: int32
        tags:
          type: array
          description: Identifiers of the tags in the scope of the report.
          items:
            type: integer
            format: int32
      description: ''
    PageInfo:
      type: object
      properties:
        number:
          type: integer
          format: int64
          example: 6
          description: The index (zero-based) of the current page returned.
        size:
          type: integer
          format: int64
          example: 10
          description: The maximum size of the page returned.
        totalPages:
          type: integer
          format: int64
          example: 13
          description: The total number of pages available.
        totalResources:
          type: integer
          format: int64
          example: 123
          description: The total number of resources available across all pages.
      description: ''
    ReportConfigCategoryFilters:
      type: object
      properties:
        excluded:
          type: array
          description: The vulnerability categories to exclude. Defaults to no categories.
          items:
            type: string
        included:
          type: array
          description: The vulnerability categories to include. Defaults to all categories.
          items:
            type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
      description: ''
    Resources_ReportInstance:
      type: object
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        resources:
          type: array
          description: The resources returned.
          items:
            $ref: '#/components/schemas/ReportInstance'
      description: ''
    ReportEmailSmtp:
      type: object
      properties:
        global:
          type: boolean
          example: true
          description: Whether to use global SMTP settings. If enabled, `sender` and `relay` may not be specified.
        relay:
          type: string
          example: mail.acme.com
          description: SMTP relay host or IP address.
        sender:
          type: string
          example: john_smith@acme.com
          description: SMTP sender address.
      description: ''
    ReferenceWithReportIDLink:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
          description: The identifier of the report instance.
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
      description: ''
    RemediationResource:
      type: object
      properties:
        solutions:
          type: integer
          format: int32
          example: 25
          description: The number of remediations to display.
          minimum: 1
        sort:
          type: string
          example: ''
          description: The attribute to prioritize remediation impact. Only supported for the `prioritized-remediations` and `prioritized-remediations-with-details` templates.
          enum:
          - assets
          - vulnerabilities
          - malware_kits
          - exploits
          - riskscore
      description: ''
    ReportFrequency:
      type: object
      properties:
        nextRuntimes:
          type: array
          description: The next scheduled run-times for generation of the report when type is `schedule`.
          readOnly: true
          items:
            type: string
        repeat:
          example: ''
          description: How often the report generates when type is `schedule`.
          $ref: '#/components/schemas/ReportRepeat'
        start:
          type: string
          example: '2018-03-01T04:31:56Z'
          description: When the report starts generating when type is `schedule`.
        type:
          type: string
          example: schedule
          description: The frequency to generate the report. `schedule` generates the report every scheduled time interval, and requires the `repeat` and `start` properties to be specified. `scan` generates the report after any scan of any element in the scope of the report. `none` does not generate the report automatically. Defaults to `none`.
          enum:
          - schedule
          - scan
          - none
      description: ''
    InternalServerError:
      type: object
      required:
      - status
      properties:
        links:
          type: array
