          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
  /reports/{report-id}:
    get:
      tags:
      - Reports
      summary: Get Report
      description: 'Get a Report

        NOTE: This API allows for the retrieval of both Report Information and Report Contents depending on which Mime-Type the client advertises acceptance of in the Accept header passed in the call.

        When retrieving only the Report Information the client should supply an Accept header value that indicates acceptance of the application/json mime type only.


        To download the Report Contents the client is required to supply Accept header values that indicate acceptance of application/pdf for PDF reports, application/zip for HTML reports or text/csv for CSV reports. To ensure errors can be returned application/json should also be provided as the second Accept header value. Attempts to download a report for which the generation status is not COMPLETE will result in a response of "204 No Content".

        This request can be polled until the status becomes COMPLETE'
      operationId: get-report
      parameters:
      - name: report-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/EntityModelReport'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Reports
      summary: Delete Report
      description: Delete an existing Report
      operationId: delete-report
      parameters:
      - name: report-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Action conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    PageMetadata:
      properties:
        index:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        sort:
          type: string
        total_data:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
        page_token:
          type: string
    EntityModelReport:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The name of the Report
          readOnly: true
        type:
          type: string
          description: The type of the Report.<br/><code>EXEC_SINGLE_APP</code> is deprecated. Use <code>EXEC_SINGLE_APP_NEW_VULNS</code> or <code>EXEC_SINGLE_APP_ALL_VULNS</code> instead. <br/><code>EXEC_ALL_APPS</code> is deprecated. Use <code>EXEC_ALL_APPS_NEW_VULNS</code> or <code>EXEC_ALL_APPS_ALL_VULNS</code> instead.
          enum:
          - VULN_SUMMARY
          - VULN_REMEDIATION
          - PCI_COMPLIANCE
          - PCI4_COMPLIANCE
          - OWASP_2013_COMPLIANCE
          - OWASP_2017_COMPLIANCE
          - OWASP_2021_COMPLIANCE
          - OWASP_2023API_COMPLIANCE
          - OWASP_2025_COMPLIANCE
          - GDPR_2016_COMPLIANCE
          - SOX_COMPLIANCE
          - HIPAA_COMPLIANCE
          - EXEC_SINGLE_APP
          - EXEC_ALL_APPS
          - EXEC_SINGLE_APP_NEW_VULNS
          - EXEC_ALL_APPS_NEW_VULNS
          - EXEC_SINGLE_APP_ALL_VULNS
          - EXEC_ALL_APPS_ALL_VULNS
          - EXEC_IAS_IVM_COMPOSITE
          - TARGET_DISCOVERY
          readOnly: true
        format:
          type: string
          description: The format of the Report
          enum:
          - HTML
          - CSV
          - PDF
          readOnly: true
        owner:
          $ref: '#/components/schemas/ReadOnlyIdResource'
        generated_date:
          type: string
          format: date-time
          description: The time the Report was generated
          readOnly: true
        app:
          $ref: '#/components/schemas/ReferenceResource'
        status:
          type: string
          description: The status of the Report
          enum:
          - PROCESSING
          - FAILED
          - COMPLETE
          readOnly: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
    ValidationError:
      properties:
        type:
          type: string
          description: The type of the validation error
          enum:
          - OBJECT
          - PROPERTY
          readOnly: true
        context:
          type: string
          description: An optional contextual indicator of a part of the request which failed validation
          readOnly: true
        explanation:
          type: string
          description: Details of the validation error
          readOnly: true
    ReportGeneration:
      properties:
        name:
          type: string
          description: The name of the Report
          example: Weekly Report
        type:
          type: string
          description: The type of the Report.<br/><code>EXEC_SINGLE_APP</code> is deprecated. Use <code>EXEC_SINGLE_APP_NEW_VULNS</code> or <code>EXEC_SINGLE_APP_ALL_VULNS</code> instead. <br/><code>EXEC_ALL_APPS</code> is deprecated. Use <code>EXEC_ALL_APPS_NEW_VULNS</code> or <code>EXEC_ALL_APPS_ALL_VULNS</code> instead.
          enum:
          - VULN_SUMMARY
          - VULN_REMEDIATION
          - PCI_COMPLIANCE
          - PCI4_COMPLIANCE
          - OWASP_2013_COMPLIANCE
          - OWASP_2017_COMPLIANCE
          - OWASP_2021_COMPLIANCE
          - OWASP_2023API_COMPLIANCE
          - OWASP_2025_COMPLIANCE
          - GDPR_2016_COMPLIANCE
          - SOX_COMPLIANCE
          - HIPAA_COMPLIANCE
          - EXEC_SINGLE_APP
          - EXEC_ALL_APPS
          - EXEC_SINGLE_APP_NEW_VULNS
          - EXEC_ALL_APPS_NEW_VULNS
          - EXEC_SINGLE_APP_ALL_VULNS
          - EXEC_ALL_APPS_ALL_VULNS
          example: VULN_SUMMARY
        format:
          type: string
          description: The format of the Report
          enum:
          - HTML
          - CSV
          - PDF
          example: PDF
        scan:
          $ref: '#/components/schemas/scan'
        app:
          $ref: '#/components/schemas/app'
        start:
          type: string
          description: The start date range scope for the Report yyyy-mm-dd
        end:
          type: string
          description: The end date range scope for the Report yyyy-mm-dd
        month:
          type: string
          description: The month date range scope for the Report yyyy-mm
          example: 2023-12
        filter:
          type: string
          description: Search-format filter relevant to the Report Type that narrows its scope
          example: vulnerability.app.name CONTAINS 'Weekly'
      required:
      - format
      - name
      - type
      title: Report Generation
    app:
      description: The App that the Scan is associated with
      properties:
        id:
          type: string
          format: uuid
    Link:
      properties:
        rel:
          type: string
        href:
          type: string
        profile:
          type: string
        name:
          type: string
      readOnly: true
    PageReport:
