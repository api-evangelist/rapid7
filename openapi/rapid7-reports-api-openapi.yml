      operationId: generate-report
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportGeneration'
        required: true
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
