openapi: 3.2.0
info:
  description: '# Overview


    This guide documents the InsightVM Application Programming Interface (API) Version 3.'
  version: '3'
  title: InsightVM Policy Override API
  contact:
    name: Rapid7
    email: support@rapid7.com
servers:
- url: https://localhost:3780/
tags:
- name: Policy Override
  description: Policy Override Resource Controller
paths:
  /api/3/assets/{id}/policy_overrides:
    get:
      tags:
      - Policy Override
      summary: Asset Policy Overrides
      description: Retrieves policy overrides defined on policy rules for the specified asset.
      operationId: getAssetPolicyOverrides
      parameters:
      - name: id
        in: path
        description: The identifier of the asset.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Resources_PolicyOverride'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/policy_overrides:
    get:
      tags:
      - Policy Override
      summary: Policy Overrides
      description: Retrieves policy overrides defined on policy rules.
      operationId: getPolicyOverrides
      parameters:
      - name: page
        in: query
        description: The index of the page (zero-based) to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: The number of records per page to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sort
        in: query
        description: 'The criteria to sort the records by, in the format: `property[,ASC|DESC]`. The default sort order is ascending. Multiple sort criteria can be specified using multiple sort query parameters.'
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PageOf_PolicyOverride'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
    post:
      tags:
      - Policy Override
      summary: Policy Overrides
      description: Submit a policy override. The policy override can be submitted or it can be submitted and approved in a single request.
      operationId: createPolicyOverride
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/CreatedReference_PolicyOverrideID_Link'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyOverride'
        description: The specification of a policy override. Allows users to override the compliance result of a policy rule.
  /api/3/policy_overrides/{id}:
    get:
      tags:
      - Policy Override
      summary: Policy Override
      description: Retrieve the specified policy override.
      operationId: getPolicyOverride
      parameters:
      - name: id
        in: path
        description: The identifier of the policy override.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PolicyOverride'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
    delete:
      tags:
      - Policy Override
      summary: Policy Override
      description: Removes a policy override created for a policy rule.
      operationId: deletePolicyOverride
      parameters:
      - name: id
        in: path
        description: The identifier of the policy override.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Links'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/policy_overrides/{id}/expires:
    get:
      tags:
      - Policy Override
      summary: Policy Override Expiration
      description: Get the expiration date for a policy override.
      operationId: getPolicyOverrideExpiration
      parameters:
      - name: id
        in: path
        description: The identifier of the policy override.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                type: string
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
    put:
      tags:
      - Policy Override
      summary: Policy Override Expiration
      description: Set the expiration date for a policy override. This must be a valid date in the future.
      operationId: setPolicyOverrideExpiration
      parameters:
      - name: id
        in: path
        description: The identifier of the policy override.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Links'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: string
        description: The date the policy override is set to expire. Date is represented in ISO 8601 format.
  /api/3/policy_overrides/{id}/{status}:
    post:
      tags:
      - Policy Override
      summary: Policy Override Status
      description: 'Update the status of the specified policy override. The status can be one of the following: `"recall"`, `"approve"`, or `"reject"`.'
      operationId: setPolicyOverrideStatus
      parameters:
      - name: id
        in: path
        description: The identifier of the policy override.
        required: true
        schema:
          type: integer
          format: int64
      - name: status
        in: path
        description: Policy Override Status
        required: true
        schema:
          type: string
          enum:
          - recall
          - approve
          - reject
      responses:
        '200':
          description: OK
          headers: {}
          content: {}
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: string
        description: A comment describing the change of the policy override status.
components:
  schemas:
    InternalServerError:
      type: object
      required:
      - status
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        message:
          type: string
          example: An error has occurred.
          description: The messages indicating the cause or reason for failure.
        status:
          type: string
          example: '500'
          description: The HTTP status code for the error (same as in the HTTP response).
          enum:
          - '500'
      description: ''
    PolicyOverrideScope:
      type: object
      required:
      - newResult
      - rule
      - type
      properties:
        asset:
          type: integer
          format: int64
          example: ''
          description: The identifier of the asset whose compliance results are to be overridden. Property is required if the property `scope` is set to either `"specific-asset"` or `"specific-asset-until-next-scan"`.
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        newResult:
          type: string
          example: ''
          description: The new policy rule result after the override is applied.
          enum:
          - pass
          - fail
          - not-applicable
          - fixed
        originalResult:
          type: string
          example: ''
          description: The original policy rule result before the override was applied. This property only applies to overrides with a scope of either `"specific-asset"` or `"specific-asset-until-next-scan"`.
          readOnly: true
          enum:
          - pass
          - fail
          - error
          - unknown
          - not-applicable
          - not-checked
          - not-selected
          - informational
          - fixed
        rule:
          type: integer
          format: int64
          example: ''
          description: The identifier of the policy rule whose compliance results are to be overridden.
        type:
          type: string
          example: ''
          description: "The scope of assets affected by the policy override. Can be one of the following values: \n| Value                              | Description                                                                                                                                                 | \n| ---------------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------- | \n| `\"all-assets\"`                     | Overrides the compliance result of all assets evaluated with the specified policy rule.                                                                     | \n| `\"specific-asset\"`                 | Overrides the compliance result of a single asset evaluated with the specified policy rule.                                                                 | \n| `\"specific-asset-until-next-scan\"` | Overrides the compliance result of a single asset evaluated with the specified policy rule until the next time asset is evaluated against that policy rule. | \n"
      description: ''
    PageOf_PolicyOverride:
      type: object
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        page:
          example: ''
          description: The details of pagination indicating which page was returned, and how the remaining pages can be retrieved.
          $ref: '#/components/schemas/PageInfo'
        resources:
          type: array
          description: The page of resources returned.
          items:
            $ref: '#/components/schemas/PolicyOverride'
      description: ''
    PolicyOverrideReviewer:
      type: object
      properties:
        comment:
          type: string
          example: ''
          description: A comment from the reviewer detailing the review. Cannot exceed 1024 characters.
          readOnly: true
        date:
          type: string
          example: ''
          description: The date the review took place.
          readOnly: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        name:
          type: string
          example: ''
          description: The identifier of the user that reviewed the policy override.
          readOnly: true
        user:
          type: integer
          format: int32
          example: ''
          description: The login name of the user that reviewed the policy override.
          readOnly: true
      description: ''
    CreatedReference_PolicyOverrideID_Link:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: The identifier of the resource created.
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
      description: ''
    Link:
      type: object
      properties:
        href:
          type: string
          example: https://hostname:3780/api/3/...
          description: 'A hypertext reference, which is either a URI (see <a target="_blank" rel="noopener noreferrer" href="https://tools.ietf.org/html/rfc3986">RFC 3986</a>) or URI template (see <a target="_blank" rel="noopener noreferrer" href="https://tools.ietf.org/html/rfc6570">RFC 6570</a>). '
        rel:
          type: string
          example: self
          description: The link relation type. This value is one from the <a target="_blank" rel="noopener noreferrer" href="https://tools.ietf.org/html/rfc5988#section-6.2">Link Relation Type Registry</a> or is the type of resource being linked to.
      description: ''
    UnauthorizedError:
      type: object
      required:
      - status
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        message:
          type: string
          example: An error has occurred.
          description: The messages indicating the cause or reason for failure.
        status:
          type: string
          example: '401'
          description: The HTTP status code for the error (same as in the HTTP response).
          enum:
          - '401'
      description: ''
    NotFoundError:
      type: object
      required:
      - status
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        message:
          type: string
          example: An error has occurred.
          description: The messages indicating the cause or reason for failure.
        status:
          type: string
          example: '404'
          description: The HTTP status code for the error (same as in the HTTP response).
          enum:
          - '404'
      description: ''
    PageInfo:
      type: object
      properties:
        number:
          type: integer
          format: int64
          example: 6
          description: The index (zero-based) of the current page returned.
        size:
          type: integer
          format: int64
          example: 10
          description: The maximum size of the page returned.
        totalPages:
          type: integer
          format: int64
          example: 13
          description: The total number of pages available.
        totalResources:
          type: integer
          format: int64
          example: 123
          description: The total number of resources available across all pages.
      description: ''
    PolicyOverrideSubmitter:
      type: object
      required:
      - comment
      properties:
        comment:
          type: string
          example: ''
          description: A comment from the submitter as to why the policy override was submitted. Cannot exceed 1024 characters.
        date:
          type: string
          example: ''
          description: The date the policy override was submitted.
          readOnly: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        name:
          type: string
          example: ''
          description: The login name of the user that submitted the policy override.
          readOnly: true
        user:
          type: integer
          format: int32
          example: ''
          description: The identifier of the user that submitted the policy override.
          readOnly: true
      description: ''
    BadRequestError:
      type: object
      required:
      - status
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        message:
          type: string
          example: An error has occurred.
          description: The messages indicating the cause or reason for failure.
        status:
          type: string
          example: '400'
          description: The HTTP status code for the error (same as in the HTTP response).
          enum:
          - '400'
      description: ''
    Links:
      type: object
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
      description: ''
    Resources_PolicyOverride:
      type: object
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        resources:
          type: array
          description: The resources returned.
          items:
            $ref: '#/components/schemas/PolicyOverride'
      description: ''
    PolicyOverride:
      type: object
      required:
      - scope
      - state
      - submit
      properties:
        expires:
          type: string
          example: ''
          description: The date the policy override is set to expire. Date is represented in ISO 8601 format.
        id:
          type: integer
          format: int64
          example: ''
          description: The identifier of the policy override.
          readOnly: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        review:
          example: ''
          description: Details regarding the review and/or approval of the policy override.
          readOnly: true
          $ref: '#/components/schemas/PolicyOverrideReviewer'
        scope:
          example: ''
          description: The scope of the policy override. Indicates which assets' policy compliance results are to be affected by the override.
          $ref: '#/components/schemas/PolicyOverrideScope'
        state:
          type: string
          example: ''
          description: "The state of the policy override. Can be one of the following values: \n| Value            | Description                                                                         | Affects Compliance Results | \n| ---------------- | ----------------------------------------------------------------------------------- |:--------------------------:| \n| `\"deleted\"`      | The policy override has been deleted.                                               |                            | \n| `\"expired\"`      | The policy override had an expiration date and it has expired.                      |                            | \n| `\"approved\"`     | The policy override was submitted and approved.                                     | &check;                    | \n| `\"rejected\"`     | The policy override was rejected by the reviewer.                                   |                            | \n| `\"under-review\"` | The policy override was submitted but not yet approved or rejected by the reviewer. |                            | \n"
        submit:
          example: ''
          description: Details regarding the submission of the policy override.
          $ref: '#/components/schemas/PolicyOverrideSubmitter'
      description: ''
    ServiceUnavailableError:
      type: object
      required:
      - status
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        message:
          type: string
          example: An error has occurred.
          description: The messages indicating the cause or reason for failure.
        status:
          type: string
          example: '503'
          description: The HTTP status code for the error (same as in the HTTP response).
          enum:
          - '503'
      description: ''
  securitySchemes:
    Basic:
      type: http
      scheme: basic
