openapi: 3.2.0
info:
  description: '# Overview


    This guide documents the InsightVM Application Programming Interface (API) Version 3.'
  version: '3'
  title: InsightVM Asset Group API
  contact:
    name: Rapid7
    email: support@rapid7.com
servers:
- url: https://localhost:3780/
tags:
- name: Asset Group
  description: Resources and operations for managing asset groups.
paths:
  /api/3/agents:
    get:
      tags:
      - Asset Group
      summary: Agents
      description: Returns the details for all agents.
      operationId: getAgents
      parameters:
      - name: page
        in: query
        description: The index of the page (zero-based) to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: The number of records per page to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sort
        in: query
        description: 'The criteria to sort the records by, in the format: `property[,ASC|DESC]`. The default sort order is ascending. Multiple sort criteria can be specified using multiple sort query parameters.'
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PageOf_Agent'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/asset_groups:
    get:
      tags:
      - Asset Group
      summary: Asset Groups
      description: Returns all asset groups.
      operationId: getAssetGroups
      parameters:
      - name: type
        in: query
        description: The type of asset group.
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: A search pattern for the name of the asset group. Searches are case-insensitive contains.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: The index of the page (zero-based) to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: The number of records per page to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sort
        in: query
        description: 'The criteria to sort the records by, in the format: `property[,ASC|DESC]`. The default sort order is ascending. Multiple sort criteria can be specified using multiple sort query parameters.'
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PageOf_AssetGroup'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
    post:
      tags:
      - Asset Group
      summary: Asset Groups
      description: 'Creates a new asset group. The `searchCriteria` field can be passed no matter what the type of the asset group is. The asset group `type` changes when the assets are refreshed. Dynamic asset groups constantly refreshed their membership as assets are scanned whereas static asset groups do not change membership automatically.

        See the Search Criteria for more information on using dynamic criteria.'
      operationId: createAssetGroup
      responses:
        '201':
          description: Created
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/CreatedReference_AssetGroupID_Link'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
      x-code-samples:
      - lang: An Empty Static Asset Group
        source: "{\n    \"description\": \"A Static Asset Group With No Assets. In order to add assets to this group you can POST to the /assets endpoint or PUT to the /assets/{assetID} endpoint.\",\n    \"name\": \"Empty Static Asset Groups\",\n    \"type\": \"static\"\n}"
      - lang: A static asset group with assets defined by search criteria
        source: "{\n    \"description\": \"A Static Asset Group with Assets that are Linux Assets running Containers (With Low Access Complexity Vulnerabilities) for remediation purposes.\",\n    \"name\": \"Container Hosts - Linux\",\n    \"searchCriteria\": {\n        \"filters\": [\n            { \"field\": \"operating-system\", \"operator\": \"contains\", \"value\": \"linux\" },\n            { \"field\": \"containers\", \"operator\": \"are\", \"value\": 0 },\n            { \"field\": \"cvss-access-complexity\", \"operator\": \"is\", \"value\": \"L\" }\n        ],\n        \"match\": \"all\"\n    },\n    \"type\": \"static\"\n}"
      - lang: A dynamic asset group
        source: "{\n    \"description\": \"A Static Asset Group with Assets that are Linux Assets running Containers (With Low Access Complexity Vulnerabilities) for remediation purposes.\",\n    \"name\": \"Container Hosts - Linux\",\n    \"searchCriteria\": {\n        \"filters\": [\n            { \"field\": \"operating-system\", \"operator\": \"contains\", \"value\": \"linux\" },\n            { \"field\": \"containers\", \"operator\": \"are\", \"value\": 0 },\n            { \"field\": \"cvss-access-complexity\", \"operator\": \"is\", \"value\": \"L\" }\n        ],\n        \"match\": \"all\"\n    },\n    \"type\": \"dynamic\"\n}"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetGroup'
        description: The details of the asset group.
