            $ref: '#/components/schemas/Link'
        resources:
          type: array
          description: The resources returned.
          items:
            $ref: '#/components/schemas/SyslogAlert'
      description: ''
    Alert:
      type: object
      required:
      - enabled
      - name
      - notification
