openapi: 3.2.0
info:
  description: '# Overview


    This guide documents the InsightVM Application Programming Interface (API) Version 3.'
  version: '3'
  title: InsightVM Site API
  contact:
    name: Rapid7
    email: support@rapid7.com
servers:
- url: https://localhost:3780/
tags:
- name: Site
  description: Resources and operations for managing sites.
paths:
  /api/3/sites/{id}/assets:
    get:
      tags:
      - Site
      summary: Site Assets
      description: Retrieves a paged resource of assets linked with the specified site.
      operationId: getSiteAssets
      parameters:
      - name: id
        in: path
        description: The identifier of the site.
        required: true
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: The index of the page (zero-based) to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: The number of records per page to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sort
        in: query
        description: 'The criteria to sort the records by, in the format: `property[,ASC|DESC]`. The default sort order is ascending. Multiple sort criteria can be specified using multiple sort query parameters.'
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PageOf_Asset'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
    delete:
      tags:
      - Site
      summary: Site Assets
      description: Removes all assets from the specified site. Assets will be deleted entirely from the Security Console if either Asset Linking is disabled or if Asset Linking is enabled and the asset only existed in this site.
      operationId: removeSiteAssets
      parameters:
      - name: id
        in: path
        description: The identifier of the site.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Links'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
