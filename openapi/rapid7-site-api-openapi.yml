    VulnerabilityEvents:
      type: object
      required:
      - confirmedVulnerabilities
      - potentialVulnerabilities
      - unconfirmedVulnerabilities
      - vulnerabilitySeverity
      properties:
        confirmedVulnerabilities:
          type: boolean
          example: false
          description: Generates an alert for vulnerability results of confirmed vulnerabilties. A vulnerability is "confirmed" when asset-specific vulnerability tests, such as exploits, produce positive results. Default value is `true`.
        potentialVulnerabilities:
          type: boolean
          example: false
          description: Generates an alert for vulnerability results of potential vulnerabilties. A vulnerability is "potential" if a check for a potential vulnerabilty is positive. Default value is `true`.
        unconfirmedVulnerabilities:
          type: boolean
          example: false
          description: Generates an alert for vulnerability results of unconfirmed vulnerabilties. A vulnerability is "unconfirmed" when a version of a scanned service or software is known to be vulnerable, but there is no positive verification. Default value is `true`.
        vulnerabilitySeverity:
          type: string
          example: ''
          description: Generates an alert for vulnerability results of the selected vulnerability severity. Default value is `"any_severity"`.
          enum:
          - any_severity
          - severe_and_critical
          - only_critical
      description: ''
    ScanTemplateWebSpiderPerformance:
      type: object
      properties:
        httpDaemonsToSkip:
          type: array
          description: The names of HTTP Daemons (HTTPd) to skip when spidering. For example, `"CUPS"`.
          items:
            type: string
        maximumDirectoryLevels:
          type: integer
          format: int32
          example: 6
          description: The directory depth limit for web spidering. Limiting directory depth can save significant time, especially with large sites. A value of `0` signifies unlimited directory traversal. Defaults to `6`.
          minimum: 1
          maximum: 100
        maximumForeignHosts:
          type: integer
          format: int32
          example: 100
          description: The maximum number of unique host names that the spider may resolve. This function adds substantial time to the spidering process, especially with large Web sites, because of frequent cross-link checking involved. Defaults to `100`.
        maximumLinkDepth:
          type: integer
          format: int32
          example: 6
          description: The maximum depth of links to traverse when spidering. Defaults to `6`.
          minimum: 0
          maximum: 100
        maximumPages:
          type: integer
          format: int32
          example: 3000
          description: The maximum the number of pages that are spidered. This is a time-saving measure for large sites. Defaults to `3000`.
          minimum: 0
          maximum: 1000000
        maximumRetries:
          type: integer
          format: int32
          example: 2
          description: The maximum the number of times to retry a request after a failure. A value of `0` means no retry attempts are made. Defaults to `2`.
          minimum: 0
          maximum: 999
        maximumTime:
          type: string
          example: PT0S
          description: The maximum length of time to web spider. This limit prevents scans from taking longer than the allotted scan schedule. A value of `PT0S` means no limit is applied. The acceptable range is `PT1M` to `PT16666.6667H`.
        responseTimeout:
          type: string
          example: PT2M
          description: The duration to wait for a response from a target web server. The value is specified as a ISO8601 duration and can range from `PT0S` (0ms) to `P1H` (1 hour). Defaults to `PT2M`.
        threadsPerServer:
          type: integer
          format: int32
          example: 3
          description: The number of threads to use per web server being spidered. Defaults to `3`.
          minimum: 0
          maximum: 999
      description: ''
