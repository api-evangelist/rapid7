          readOnly: true
        moderate:
          type: integer
          format: int64
          example: 3
          description: The number of moderate vulnerabilities.
          readOnly: true
        severe:
          type: integer
          format: int64
          example: 76
          description: The number of severe vulnerabilities.
          readOnly: true
        total:
          type: integer
          format: int64
          example: 95
          description: The total number of vulnerabilities.
          readOnly: true
      description: ''
    PageOf_Site:
