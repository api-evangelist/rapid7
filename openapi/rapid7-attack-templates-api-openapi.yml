components:
  schemas:
    PageMetadata:
      properties:
        index:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        sort:
          type: string
        total_data:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
        page_token:
          type: string
    ValidationError:
      properties:
        type:
          type: string
          description: The type of the validation error
          enum:
          - OBJECT
          - PROPERTY
          readOnly: true
        context:
          type: string
          description: An optional contextual indicator of a part of the request which failed validation
          readOnly: true
        explanation:
          type: string
          description: Details of the validation error
          readOnly: true
    PageAttackTemplate:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EntityModelAttackTemplate'
        metadata:
          $ref: '#/components/schemas/PageMetadata'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
    AttackTemplate:
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the attack template
          readOnly: true
        name:
          type: string
          description: The name of the attack template
        description:
          type: string
          description: The description of the attack template
        system_defined:
          type: boolean
          description: 'A read-only flag that indicates if the Attack Template is system-defined (immutable) '
          readOnly: true
        browser_encoding_enabled:
          type: boolean
          description: A flag that is used to enforce browser encoding on all attacks
        attack_prioritization:
          type: string
          description: The Attack Prioritization type
          enum:
          - SEQUENTIAL
          - SMART
          - RANDOMIZED
        advanced_attacks_enabled:
          type: boolean
          description: A flag to enable advanced Attacks
        false_positive_regex:
          type: string
          description: Regex used to indicate a false positive
          maxLength: 200
          minLength: 0
      required:
      - name
      title: AttackTemplate
    Link:
      properties:
        rel:
          type: string
        href:
          type: string
        profile:
          type: string
        name:
          type: string
      readOnly: true
    Error:
      properties:
        status:
          type: string
          description: A description of the type of error based on HTTP status code
          enum:
          - 100 CONTINUE
          - 101 SWITCHING_PROTOCOLS
          - 102 PROCESSING
          - 103 EARLY_HINTS
          - 103 CHECKPOINT
          - 200 OK
          - 201 CREATED
          - 202 ACCEPTED
          - 203 NON_AUTHORITATIVE_INFORMATION
          - 204 NO_CONTENT
          - 205 RESET_CONTENT
          - 206 PARTIAL_CONTENT
          - 207 MULTI_STATUS
          - 208 ALREADY_REPORTED
          - 226 IM_USED
          - 300 MULTIPLE_CHOICES
          - 301 MOVED_PERMANENTLY
          - 302 FOUND
          - 302 MOVED_TEMPORARILY
          - 303 SEE_OTHER
          - 304 NOT_MODIFIED
          - 305 USE_PROXY
          - 307 TEMPORARY_REDIRECT
          - 308 PERMANENT_REDIRECT
          - 400 BAD_REQUEST
          - 401 UNAUTHORIZED
          - 402 PAYMENT_REQUIRED
          - 403 FORBIDDEN
          - 404 NOT_FOUND
          - 405 METHOD_NOT_ALLOWED
          - 406 NOT_ACCEPTABLE
          - 407 PROXY_AUTHENTICATION_REQUIRED
          - 408 REQUEST_TIMEOUT
          - 409 CONFLICT
          - 410 GONE
          - 411 LENGTH_REQUIRED
          - 412 PRECONDITION_FAILED
          - 413 PAYLOAD_TOO_LARGE
          - 413 REQUEST_ENTITY_TOO_LARGE
          - 414 URI_TOO_LONG
          - 414 REQUEST_URI_TOO_LONG
          - 415 UNSUPPORTED_MEDIA_TYPE
          - 416 REQUESTED_RANGE_NOT_SATISFIABLE
          - 417 EXPECTATION_FAILED
          - 418 I_AM_A_TEAPOT
          - 419 INSUFFICIENT_SPACE_ON_RESOURCE
          - 420 METHOD_FAILURE
          - 421 DESTINATION_LOCKED
          - 422 UNPROCESSABLE_ENTITY
          - 423 LOCKED
          - 424 FAILED_DEPENDENCY
          - 425 TOO_EARLY
          - 426 UPGRADE_REQUIRED
          - 428 PRECONDITION_REQUIRED
          - 429 TOO_MANY_REQUESTS
          - 431 REQUEST_HEADER_FIELDS_TOO_LARGE
          - 451 UNAVAILABLE_FOR_LEGAL_REASONS
          - 500 INTERNAL_SERVER_ERROR
          - 501 NOT_IMPLEMENTED
          - 502 BAD_GATEWAY
          - 503 SERVICE_UNAVAILABLE
          - 504 GATEWAY_TIMEOUT
          - 505 HTTP_VERSION_NOT_SUPPORTED
          - 506 VARIANT_ALSO_NEGOTIATES
          - 507 INSUFFICIENT_STORAGE
          - 508 LOOP_DETECTED
          - 509 BANDWIDTH_LIMIT_EXCEEDED
          - 510 NOT_EXTENDED
          - 511 NETWORK_AUTHENTICATION_REQUIRED
          readOnly: true
        message:
          type: string
          description: A description of the error
          readOnly: true
        errorCode:
          type: string
          description: An optional code which may help support indicate the underlying cause of the error
          enum:
          - E1
          - E2
          - E3
          - E4
          - E5
          - E6
          - E7
          - E8
          - E9
          - E10
          - E11
          - E12
          - E13
          - E14
          - E15
          - E16
          - E17
          - E18
          - E19
          - E20
          - E22
          - E23
          - E24
          - E25
          - E26
          - E27
          - E28
          - E999
          readOnly: true
      title: Error
    ModuleConfig:
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the default attack module
          readOnly: true
        name:
          type: string
          description: The name of the default attack module
        description:
          type: string
          description: The description of the default attack module
        types:
          type: array
          description: The type of the default attack module
          items:
            type: string
            description: The type of the default attack module
            enum:
            - ACTIVE
            - PASSIVE
          uniqueItems: true
        max_findings:
          type: integer
          format: int32
          description: The maximum findings of the default attack module
        severity:
          type: string
          description: The severity of the default attack module
          enum:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
          - INFORMATIONAL
          - SAFE
        parameter_locations:
          type: array
          description: The list of parameters locations for default attack module
          items:
            type: string
            description: The list of parameters locations for default attack module
            enum:
            - DIRECTORY
            - FILE
            - PATH
            - QUERY
            - FRAGMENT
            - POST
            - HTTP_HEADER
            - COOKIE
            - REFERER
          uniqueItems: true
      title: ModuleConfig
    EntityModelAttackTemplate:
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the attack template
          readOnly: true
        name:
          type: string
          description: The name of the attack template
        description:
          type: string
          description: The description of the attack template
        system_defined:
          type: boolean
          description: 'A read-only flag that indicates if the Attack Template is system-defined (immutable) '
          readOnly: true
        browser_encoding_enabled:
          type: boolean
          description: A flag that is used to enforce browser encoding on all attacks
        attack_prioritization:
