openapi: 3.2.0
info:
  title: InsightAppSec Blackouts API
  description: Welcome to the reference documentation for the public APIs available for InsightAppSec.
  version: v1
servers:
- url: https://[region].api.insight.rapid7.com/ias/v1
tags:
- name: Blackouts
  description: A blackout is a period of time when all scanning activities for the specified scope are blocked.
paths:
  /blackouts:
    get:
      tags:
      - Blackouts
      summary: Get Blackouts
      description: 'Get a page of Blackouts, based on supplied pagination parameters.

        The default sort for Blackouts is "name" (ascending); for a full list of sortable properties, refer to the Search Catalog detailed in the Search API.'
      operationId: get-blackouts
      parameters:
      - name: index
        in: query
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        schema:
          type: string
      - name: page-token
        in: query
        schema:
          type: string
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBlackout'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Blackouts
      summary: Create Blackout
      description: Create a new Blackout
      operationId: create-blackout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blackout'
        required: true
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Action conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Resource validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
  /blackouts/{blackout-id}:
    get:
      tags:
      - Blackouts
      summary: Get Blackout
      description: Get a Blackout
      operationId: get-blackout
      parameters:
      - name: blackout-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityModelBlackout'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Blackouts
      summary: Update Blackout
      description: Update an existing Blackout
      operationId: update-blackout
      parameters:
      - name: blackout-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blackout'
        required: true
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Action conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Resource validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
    delete:
      tags:
      - Blackouts
      summary: Delete Blackout
      description: Delete an existing Blackout
      operationId: delete-blackout
      parameters:
      - name: blackout-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Action conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    PageMetadata:
      properties:
        index:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        sort:
          type: string
        total_data:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
        page_token:
          type: string
    ValidationError:
      properties:
        type:
          type: string
          description: The type of the validation error
          enum:
          - OBJECT
          - PROPERTY
          readOnly: true
        context:
          type: string
          description: An optional contextual indicator of a part of the request which failed validation
          readOnly: true
        explanation:
          type: string
          description: Details of the validation error
          readOnly: true
    PageBlackout:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EntityModelBlackout'
        metadata:
          $ref: '#/components/schemas/PageMetadata'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
    Blackout:
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the Blackout
          readOnly: true
        name:
          type: string
          description: The name of the Blackout
          maxLength: 200
          minLength: 1
        scope:
          type: string
          description: The scope of the Blackout
          enum:
          - APP
          - GLOBAL
          readOnly: true
        enabled:
          type: boolean
          description: The enabled property of the Blackout
        active:
          type: boolean
          description: The current active status of the Blackout
          readOnly: true
        app:
          $ref: '#/components/schemas/ReferenceResource'
        first_start:
          type: string
          format: date-time
          description: The first start date and time of the Blackout
        first_end:
          type: string
          format: date-time
          description: The first end date and time of the Blackout
        last_start:
          type: string
          format: date-time
          description: The last start date and time of the Blackout
        frequency:
          $ref: '#/components/schemas/Frequency'
        rrule:
          type: string
          description: The rrule describes how (and if) the blackout should repeat. Should not be included if a frequency has been provided.
      required:
      - enabled
      - first_end
      - first_start
      - name
      title: Blackout
    Link:
      properties:
        rel:
          type: string
        href:
          type: string
        profile:
          type: string
        name:
          type: string
      readOnly: true
    Frequency:
      description: The frequency at which the Blackout applies. Should not be included if a rrule has been provided.
      properties:
        type:
          type: string
          description: The type of the Frequency
          enum:
          - ONCE
          - HOURLY
          - DAILY
          - WEEKLY
          - MONTHLY
        interval:
          type: integer
          format: int32
          description: The interval of the Frequency
      title: Frequency
    EntityModelBlackout:
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the Blackout
          readOnly: true
        name:
          type: string
          description: The name of the Blackout
          maxLength: 200
          minLength: 1
        scope:
          type: string
          description: The scope of the Blackout
          enum:
          - APP
          - GLOBAL
          readOnly: true
        enabled:
          type: boolean
          description: The enabled property of the Blackout
        active:
          type: boolean
          description: The current active status of the Blackout
          readOnly: true
        app:
          $ref: '#/components/schemas/ReferenceResource'
        first_start:
          type: string
          format: date-time
          description: The first start date and time of the Blackout
        first_end:
          type: string
          format: date-time
          description: The first end date and time of the Blackout
        last_start:
          type: string
          format: date-time
          description: The last start date and time of the Blackout
        frequency:
          $ref: '#/components/schemas/Frequency'
        rrule:
          type: string
          description: The rrule describes how (and if) the blackout should repeat. Should not be included if a frequency has been provided.
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
      required:
      - enabled
      - first_end
      - first_start
      - name
    Error:
      properties:
        status:
          type: string
          description: A description of the type of error based on HTTP status code
          enum:
          - 100 CONTINUE
          - 101 SWITCHING_PROTOCOLS
          - 102 PROCESSING
          - 103 EARLY_HINTS
          - 103 CHECKPOINT
          - 200 OK
          - 201 CREATED
          - 202 ACCEPTED
          - 203 NON_AUTHORITATIVE_INFORMATION
          - 204 NO_CONTENT
          - 205 RESET_CONTENT
          - 206 PARTIAL_CONTENT
          - 207 MULTI_STATUS
          - 208 ALREADY_REPORTED
          - 226 IM_USED
          - 300 MULTIPLE_CHOICES
          - 301 MOVED_PERMANENTLY
          - 302 FOUND
          - 302 MOVED_TEMPORARILY
          - 303 SEE_OTHER
          - 304 NOT_MODIFIED
          - 305 USE_PROXY
          - 307 TEMPORARY_REDIRECT
