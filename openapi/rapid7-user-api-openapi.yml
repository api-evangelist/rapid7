components:
  schemas:
    CreatedReference_UserID_Link:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
          description: The identifier of the resource created.
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
      description: ''
    PageOf_User:
      type: object
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        page:
          example: ''
          description: The details of pagination indicating which page was returned, and how the remaining pages can be retrieved.
          $ref: '#/components/schemas/PageInfo'
        resources:
          type: array
          description: The page of resources returned.
          items:
            $ref: '#/components/schemas/User'
      description: ''
    TokenResource:
      type: object
      properties:
        key:
          type: string
          example: ''
          description: The two-factor authentication token seed (key).
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          readOnly: true
          items:
            $ref: '#/components/schemas/Link'
      description: ''
    PageInfo:
      type: object
      properties:
        number:
          type: integer
          format: int64
          example: 6
          description: The index (zero-based) of the current page returned.
        size:
          type: integer
          format: int64
          example: 10
          description: The maximum size of the page returned.
        totalPages:
          type: integer
          format: int64
          example: 13
          description: The total number of pages available.
        totalResources:
          type: integer
          format: int64
          example: 123
          description: The total number of resources available across all pages.
      description: ''
    ReferencesWith_UserID_Link:
      type: object
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        resources:
          type: array
          description: The identifiers of the associated resources.
          items:
            type: integer
            format: int32
      description: ''
    LocalePreferences:
      type: object
      properties:
        default:
          type: string
          example: ''
          description: The default language to use. The format is a <a target="_blank" rel="noopener noreferrer" href="https://tools.ietf.org/html/bcp47">IETF BCP 47</a> language tag.
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        reports:
          type: string
          example: ''
          description: The language to use to generate reports. The format is a <a target="_blank" rel="noopener noreferrer" href="https://tools.ietf.org/html/bcp47">IETF BCP 47</a> language tag.
      description: ''
    ReferencesWith_AssetGroupID_Link:
      type: object
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        resources:
          type: array
          description: The identifiers of the associated resources.
          items:
            type: integer
            format: int32
      description: ''
    Privileges:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        resources:
          type: array
          items:
            type: string
            enum:
            - all-permissions
            - create-reports
            - configure-global-settings
            - manage-sites
