components:
  schemas:
    Software:
      type: object
      properties:
        configurations:
          type: array
          description: The attributes of the software.
          items:
            $ref: '#/components/schemas/Configuration'
        cpe:
          example: ''
          description: The Common Platform Enumeration (CPE) of the software.
          $ref: '#/components/schemas/SoftwareCpe'
        description:
          type: string
          example: Microsoft Outlook 2013 15.0.4867.1000
          description: The description of the software.
        family:
          type: string
          example: Office 2013
          description: The family of the software.
        id:
          type: integer
          format: int64
        product:
          type: string
          example: Outlook 2013
          description: The product of the software.
        type:
          type: string
          example: Productivity
          description: The version of the software.
        vendor:
          type: string
          example: Microsoft
          description: The vendor of the software.
        version:
          type: string
          example: 15.0.4867.1000
          description: The version of the software.
      description: ''
    CreatedReference:
      type: object
      properties:
        id:
          type: object
          example: '1'
          description: The identifier of the resource created.
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
      description: ''
    Resources_Configuration:
      type: object
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        resources:
          type: array
          description: The resources returned.
          items:
            $ref: '#/components/schemas/Configuration'
      description: ''
    SoftwareCpe:
      type: object
      required:
      - part
      properties:
        edition:
          type: string
          example: enterprise
          description: 'Edition-related terms applied by the vendor to the product. '
        language:
          type: string
          example: ''
          description: Defines the language supported in the user interface of the product being described. The format is of the language tag adheres to <a target="_blank" rel="noopener noreferrer" href="https://tools.ietf.org/html/rfc5646">RFC5646</a>.
        other:
          type: string
          example: ''
          description: 'Captures any other general descriptive or identifying information which is vendor- or product-specific and which does not logically fit in any other attribute value. '
        part:
          type: string
          example: o
          description: A single letter code that designates the particular platform part that is being identified.
          enum:
          - o
          - a
          - h
        product:
          type: string
          example: windows_server_2008
          description: the most common and recognizable title or name of the product.
        swEdition:
          type: string
          example: ''
          description: 'Characterizes how the product is tailored to a particular market or class of end users. '
        targetHW:
          type: string
          example: ''
          description: 'Characterize the instruction set architecture on which the product operates. '
        targetSW:
          type: string
          example: ''
          description: Characterize the software computing environment within which the product operates.
        update:
          type: string
          example: sp1
          description: Vendor-specific alphanumeric strings characterizing the particular update, service pack, or point release of the product.
        v2.2:
          type: string
          example: cpe:/o:microsoft:windows_server_2008:-:sp1:enterprise
          description: The full CPE string in the <a target="_blank" rel="noopener noreferrer" href="https://cpe.mitre.org/files/cpe-specification_2.2.pdf">CPE 2.2</a> format.
        v2.3:
          type: string
          example: cpe:2.3:o:microsoft:windows_server_2008:-:sp1:enterprise:*:*:*:*:*
          description: The full CPE string in the <a target="_blank" rel="noopener noreferrer" href="http://nvlpubs.nist.gov/nistpubs/Legacy/IR/nistir7695.pdf">CPE 2.3</a> format.
        vendor:
          type: string
          example: microsoft
          description: The person or organization that manufactured or created the product.
        version:
          type: string
          example: '-'
          description: Vendor-specific alphanumeric strings characterizing the particular release version of the product.
      description: ''
    PageInfo:
      type: object
      properties:
        number:
          type: integer
          format: int64
          example: 6
          description: The index (zero-based) of the current page returned.
        size:
          type: integer
          format: int64
          example: 10
          description: The maximum size of the page returned.
        totalPages:
          type: integer
          format: int64
          example: 13
          description: The total number of pages available.
        totalResources:
          type: integer
          format: int64
          example: 123
          description: The total number of resources available across all pages.
      description: ''
    AssetVulnerabilities:
      type: object
      properties:
        critical:
          type: integer
          format: int64
          example: 16
          description: The number of critical vulnerabilities.
          readOnly: true
        exploits:
          type: integer
          format: int64
          example: 4
          description: The number of distinct exploits that can exploit any of the vulnerabilities on the asset.
          readOnly: true
        malwareKits:
          type: integer
          format: int64
          example: 0
          description: The number of distinct malware kits that vulnerabilities on the asset are susceptible to.
          readOnly: true
        moderate:
          type: integer
          format: int64
          example: 3
          description: The number of moderate vulnerabilities.
          readOnly: true
        severe:
          type: integer
          format: int64
          example: 76
          description: The number of severe vulnerabilities.
          readOnly: true
        total:
          type: integer
          format: int64
          example: 95
          description: The total number of vulnerabilities.
          readOnly: true
      description: ''
    Resources_Database:
      type: object
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
