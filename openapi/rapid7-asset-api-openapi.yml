openapi: 3.2.0
info:
  description: '# Overview


    This guide documents the InsightVM Application Programming Interface (API) Version 3.'
  version: '3'
  title: InsightVM Asset API
  contact:
    name: Rapid7
    email: support@rapid7.com
servers:
- url: https://localhost:3780/
tags:
- name: Asset
  description: Resources and operations for managing assets. Assets can be created under the Site Assets resource.
paths:
  /api/3/assets:
    get:
      tags:
      - Asset
      summary: Assets
      description: Returns all assets for which you have access.
      operationId: getAssets
      parameters:
      - name: page
        in: query
        description: The index of the page (zero-based) to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: The number of records per page to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sort
        in: query
        description: 'The criteria to sort the records by, in the format: `property[,ASC|DESC]`. The default sort order is ascending. Multiple sort criteria can be specified using multiple sort query parameters.'
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PageOf_Asset'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/sites/{id}/assets:
    post:
      tags:
      - Asset
      summary: Assets
      description: Creates or updates an asset with the specified details.
      operationId: createAsset
      parameters:
      - name: id
        in: path
        description: The identifier of the site.
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/CreatedReference'
        '201':
          description: Created
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/CreatedOrUpdatedReference'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreate'
        description: "The details of the asset being added or updated. \nThe operating system can be specified in one of three ways, with the order of precedence: `\"osFingerprint\"`, `\"os\"`, `\"cpe\"`"
  /api/3/assets/search:
    post:
      tags:
      - Asset
      summary: Asset Search
      description: Returns all assets for which you have access that match the given search criteria.
      operationId: findAssets
      parameters:
      - name: page
        in: query
        description: The index of the page (zero-based) to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: The number of records per page to retrieve.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: sort
        in: query
        description: 'The criteria to sort the records by, in the format: `property[,ASC|DESC]`. The default sort order is ascending. Multiple sort criteria can be specified using multiple sort query parameters.'
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/PageOf_Asset'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
      x-code-samples:
      - lang: Assets Running SSH
        source: "{\n  \"match\": \"all\",\n  \"filters\": [\n     { \"field\": \"service-name\", \"operator\": \"contains\", \"value\": \"ssh\"}\n  ]\n}"
      - lang: High Risk Windows Assets Running SSH
        source: "{\n  \"match\": \"all\",\n  \"filters\": [\n     { \"field\": \"risk-score\", \"operator\": \"is-greater-than\", \"value\": 5000 },\n     { \"field\": \"operating-system\", \"operator\": \"contains\", \"value\": \"windows\" },\n     { \"field\": \"service-name\", \"operator\": \"contains\", \"value\": \"ssh\" }\n  ]\n}"
      - lang: Windows 10 Assets
        source: "{\n  \"match\": \"all\",\n  \"filters\": [\n     { \"field\": \"operating-system\", \"operator\": \"contains\", \"value\": \"Microsoft Windows 10\" }\n  ]\n}"
      - lang: Assets with High CVSS Scores assigned to Bob
        source: "{\n   \"match\": \"all\",\n   \"filters\": [\n      { \"field\": \"owner-tag\", \"operator\": \"contains\", \"value\": \"Bob\" },\n      { \"field\": \"vulnerability-cvss-score\", \"operator\": \"is-greater-than\", \"value\": 8 }\n   ]\n}"
      - lang: Assets with SSH running containers in Los Angeles
        source: "{\n   \"match\": \"all\",\n   \"filters\": [\n      { \"field\": \"location-tag\", \"operator\": \"contains\", \"value\": \"Los Angeles Datacenter\" },\n      { \"field\": \"containers\", \"operator\": \"are\", \"value\": \"0\" },\n      { \"field\": \"service-name\", \"operator\": \"contains\", \"value\": \"ssh\" }\n   ]\n}"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCriteria'
        description: param1
        required: true
