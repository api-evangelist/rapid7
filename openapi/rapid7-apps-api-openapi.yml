          type: array
          items:
            $ref: '#/components/schemas/EntityModelApp'
        metadata:
          $ref: '#/components/schemas/PageMetadata'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          readOnly: true
    ReferenceResource:
      description: The last editor of the comment
      properties:
