    App:
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the App
          readOnly: true
        name:
          type: string
          description: The name of the App
          maxLength: 200
          minLength: 1
        description:
          type: string
          description: The description of the App
          maxLength: 2000
          minLength: 0
      required:
