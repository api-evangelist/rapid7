openapi: 3.2.0
info:
  description: '# Overview


    This guide documents the InsightVM Application Programming Interface (API) Version 3.'
  version: '3'
  title: InsightVM Administration API
  contact:
    name: Rapid7
    email: support@rapid7.com
servers:
- url: https://localhost:3780/
tags:
- name: Administration
  description: Provides access administrative operations and procedures.
paths:
  /api/3/administration/commands:
    post:
      tags:
      - Administration
      summary: Console Commands
      description: Executes a console command against the Security Console. Global Administrator
      operationId: executeCommand
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ConsoleCommandOutput'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
      x-code-samples:
      - lang: Show Host Info
        source: show host info
      - lang: Help
        source: help
      requestBody:
        content:
          application/json:
            schema:
              type: string
        description: The console command to execute.
  /api/3/administration/info:
    get:
      tags:
      - Administration
      summary: Information
      description: Returns system details, including host and version information.
      operationId: getInfo
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Info'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/administration/license:
    get:
      tags:
      - Administration
      summary: License
      description: Returns the enabled features and limits of the current license. Global Administrator
      operationId: getLicense
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/License'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
    post:
      tags:
      - Administration
      summary: License
      description: Licenses the product with an activation key or a provided license file. If both are provided, the license file is preferred. Global Administrator
      operationId: activateLicense
      parameters:
      - name: key
        in: query
        description: A license activation key.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Links'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                license:
                  type: string
                  description: The contents of a license (.lic) file.
                  format: binary
  /api/3/administration/properties:
    get:
      tags:
      - Administration
      summary: Properties
      description: Returns system details, including host and version information.
      operationId: getProperties
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/EnvironmentProperties'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
  /api/3/administration/settings:
    get:
      tags:
      - Administration
      summary: Settings
      description: Returns the current administration settings. Global Administrator
      operationId: getSettings
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      security: []
components:
  schemas:
    LicenseScanning:
      type: object
      properties:
        discovery:
          type: boolean
          example: true
          description: Whether discovery scanning may be used.
        policy:
          example: 'true'
          description: Details as to whether policy scanning and what benchmarks are available.
          $ref: '#/components/schemas/LicensePolicyScanning'
        scada:
          type: boolean
          example: true
          description: Whether SCADA scanning may be used.
        virtual:
          type: boolean
          example: true
          description: Whether virtual scanning may be used.
        webApplication:
          type: boolean
          example: true
          description: Whether web scanning may be used.
      description: ''
    InstallSize:
      type: object
      properties:
        backups:
          example: ''
          description: The disk space used by backups.
          $ref: '#/components/schemas/BackupsSize'
        database:
          example: ''
          description: The disk space used by the database.
          $ref: '#/components/schemas/DatabaseSize'
        directory:
          type: string
          example: ''
          description: The installation directory.
        reports:
          example: ''
          description: The disk space used by reports.
          $ref: '#/components/schemas/ReportSize'
        scans:
          example: ''
          description: The disk space used by scans.
          $ref: '#/components/schemas/ScanSize'
        total:
          example: ''
          description: Total disk space used by the installation.
          $ref: '#/components/schemas/InstallationTotalSize'
      description: ''
    ReportSize:
      type: object
      properties:
        bytes:
          type: integer
          format: int64
          example: 24789050
          description: The raw value in bytes.
        formatted:
          type: string
          example: 23.6 MB
          description: The value formatted in human-readable notation (e.g. GB, MB, KB, bytes).
      description: ''
    ScanSettings:
      type: object
      properties:
        connectionTimeout:
          type: string
          example: PT15S
          description: 'The connection timeout when establishing connections to remote scan engines, in ISO 8601 format. For example: `"PT15S"`.'
        incremental:
          type: boolean
          example: true
          description: Whether incremental scan results is enabled.
        maximumThreads:
          type: integer
          format: int32
          example: -1
          description: The maximum number of scan threads to use in any scan. -1 means this is set by the scan template.
        readTimeout:
          type: string
          example: PT15M
          description: 'The read timeout when establishing connections to remote scan engines, in ISO 8601 format. For example: `"PT15M"`.'
        statusIdleTimeout:
          type: string
          example: PT3M
          description: 'The idle timeout when checking the status of running scans, in ISO 8601 format. For example: `"PT3M"`.'
        statusThreads:
          type: integer
          format: int32
          example: 3
          description: The number of threads to use when checking the status of running scans.
      description: ''
    LicenseLimits:
      type: object
      properties:
        assets:
          type: integer
          format: int32
          example: 100000
          description: The maximum number of assets that can be assessed.
        assetsWithHostedEngine:
          type: integer
          format: int32
          example: 1000
          description: The maximum number of assets that may be scanned with the hosted scan engine.
        scanEngines:
          type: integer
          format: int32
          example: 100
          description: The maximum number of scan engines that may be used.
        users:
          type: integer
          format: int32
          example: 1000
          description: The maximum number of users allowed.
      description: ''
    ConsoleCommandOutput:
      type: object
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          readOnly: true
          items:
            $ref: '#/components/schemas/Link'
        output:
          type: string
          example: ''
          description: The output of the command that was executed.
      description: ''
    InstallationTotalSize:
      type: object
      properties:
        bytes:
          type: integer
          format: int64
          example: 12125933077
          description: The raw value in bytes.
        formatted:
          type: string
          example: 11.3 GB
          description: The value formatted in human-readable notation (e.g. GB, MB, KB, bytes).
      description: ''
    EnvironmentProperties:
      type: object
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          readOnly: true
          items:
            $ref: '#/components/schemas/Link'
        properties:
          type: object
          example: ''
          description: Key-value pairs for system and environment properties that are currently defined.
      description: ''
    LicensePolicyScanning:
      type: object
      properties:
        benchmarks:
          example: ''
          description: The benchmarks available to policy scan.
          $ref: '#/components/schemas/LicensePolicyScanningBenchmarks'
        scanning:
          type: boolean
          example: true
          description: Whether policy scanning is allowed.
      description: ''
    UpdateId:
      type: object
      properties:
        productId:
          type: string
          example: '281474976711146'
          description: Product update identifier.
        versionId:
          type: string
          example: '490'
          description: Version update identifier.
      description: ''
    UpdateSettings:
      type: object
      properties:
        contentAutoUpdate:
          type: boolean
          example: true
          description: Whether automatic content updates are enabled.
        enabled:
          type: boolean
          example: true
          description: Whether updates are enabled.
        productAutoUpdate:
          type: boolean
          example: true
          description: Whether automatic product updates are enabled.
      description: ''
    InternalServerError:
      type: object
      required:
      - status
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        message:
          type: string
          example: An error has occurred.
          description: The messages indicating the cause or reason for failure.
        status:
          type: string
          example: '500'
          description: The HTTP status code for the error (same as in the HTTP response).
          enum:
          - '500'
      description: ''
    CPUInfo:
      type: object
      properties:
        clockSpeed:
          type: integer
          format: int32
          example: 2600
          description: The clock speed of the host, in MHz.
        count:
          type: integer
          format: int32
          example: 8
          description: The number of CPUs.
      description: ''
    DiskTotal:
      type: object
      properties:
        bytes:
          type: integer
          format: int64
          example: 499004735488
          description: The raw value in bytes.
        formatted:
          type: string
          example: 464.7 GB
          description: The value formatted in human-readable notation (e.g. GB, MB, KB, bytes).
      description: ''
    NotFoundError:
      type: object
      required:
      - status
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        message:
          type: string
          example: An error has occurred.
          description: The messages indicating the cause or reason for failure.
        status:
          type: string
          example: '404'
          description: The HTTP status code for the error (same as in the HTTP response).
          enum:
          - '404'
      description: ''
    AuthenticationSettings:
      type: object
      properties:
        2fa:
          type: boolean
          example: false
          description: Whether two-factor authentication is enabled.
        loginLockThreshold:
          type: integer
          format: int32
          example: 'true'
          description: The maximum number of failed login attempts for an account becomes locked.
      description: ''
    BackupsSize:
      type: object
      properties:
        bytes:
          type: integer
          format: int64
          example: 0
          description: The raw value in bytes.
        formatted:
          type: string
          example: 0 bytes
          description: The value formatted in human-readable notation (e.g. GB, MB, KB, bytes).
      description: ''
    UpdateInfo:
      type: object
      properties:
        content:
          type: string
          example: '3192129162'
          description: The most recent content update.
        contentPartial:
          type: string
          example: '723680177'
          description: The most recent, partially-applied (in-memory), content update.
        id:
          example: ''
          description: Details of update identifiers.
          $ref: '#/components/schemas/UpdateId'
        product:
          type: string
          example: '2200922472'
          description: The most recent product update.
      description: ''
    JVMInfo:
      type: object
      properties:
        name:
          type: string
          example: OpenJDK 64-Bit Server VM
          description: The name of the Java Virtual Machine.
        startTime:
          type: string
          example: '2018-02-13T20:35:35.076Z'
          description: The date and time the Java Virtual Machine last started.
        uptime:
          type: string
          example: PT8H21M7.978S
          description: 'Total up-time of the Java Virtual Machine, in ISO 8601 format. For example: `"PT1H4M24.214S"`.'
        vendor:
          type: string
          example: Azul Systems, Inc.
          description: The vendor of the Java Virtual Machine.
        version:
          type: string
          example: 25.102-b14
          description: The version of the Java Virtual Machine.
      description: ''
    DatabaseConnectionSettings:
      type: object
      properties:
        maximumAdministrationPoolSize:
          type: integer
          format: int32
          example: -1
          description: The maximum number of administrative connections in the connection pool. -1 means unlimited.
        maximumPoolSize:
          type: integer
          format: int32
          example: -1
          description: The maximum number of connections in the connection pool. -1 means unlimited.
        maximumPreparedStatementPoolSize:
          type: integer
          format: int32
          example: 256
          description: The maximum number of prepared statements in the prepared statement pool. -1 means unlimited.
      description: ''
    License:
      type: object
      properties:
        edition:
          type: string
          example: InsightVM
          description: The edition of the product.
        evaluation:
          type: boolean
          example: false
          description: Whether the license is a time-restricted evaluation.
        expires:
          type: string
          example: '2018-12-31T23:59:59.999Z'
          description: The date and time the license expires.
        features:
          example: ''
          description: The features available in the license.
          $ref: '#/components/schemas/Features'
        limits:
          example: ''
          description: The limits of the license.
          $ref: '#/components/schemas/LicenseLimits'
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          readOnly: true
          items:
            $ref: '#/components/schemas/Link'
        perpetual:
          type: boolean
          example: false
          description: Whether the license is perpetual.
        status:
          type: string
          example: Activated
          description: The status of the license.
          enum:
          - Activated
          - Unlicensed
          - Expired
          - Evaluation Mode
          - Revoked
          - Unknown
      description: ''
    ServiceUnavailableError:
      type: object
      required:
      - status
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        message:
          type: string
          example: An error has occurred.
          description: The messages indicating the cause or reason for failure.
        status:
          type: string
          example: '503'
          description: The HTTP status code for the error (same as in the HTTP response).
          enum:
          - '503'
      description: ''
    WebSettings:
      type: object
      properties:
        maxThreads:
          type: integer
          format: int32
          example: 100
          description: The maximum number of request handling threads.
        minThreads:
          type: integer
          format: int32
          example: 10
          description: The minimum number of request handling threads.
        port:
          type: integer
          format: int32
          example: 3780
          description: The port the web server is accepting requests.
        sessionTimeout:
          type: string
          example: PT10M
          description: 'Session timeout duration, in ISO 8601 format. For example: `"PT10M"`.'
      description: ''
    Link:
      type: object
      properties:
        href:
          type: string
          example: https://hostname:3780/api/3/...
          description: 'A hypertext reference, which is either a URI (see <a target="_blank" rel="noopener noreferrer" href="https://tools.ietf.org/html/rfc3986">RFC 3986</a>) or URI template (see <a target="_blank" rel="noopener noreferrer" href="https://tools.ietf.org/html/rfc6570">RFC 6570</a>). '
        rel:
          type: string
          example: self
          description: The link relation type. This value is one from the <a target="_blank" rel="noopener noreferrer" href="https://tools.ietf.org/html/rfc5988#section-6.2">Link Relation Type Registry</a> or is the type of resource being linked to.
      description: ''
    MemoryInfo:
      type: object
      properties:
        free:
          example: ''
          description: Free memory.
          $ref: '#/components/schemas/MemoryFree'
        total:
          example: ''
          description: Total memory usage.
          $ref: '#/components/schemas/MemoryTotal'
      description: ''
    BadRequestError:
      type: object
      required:
      - status
      properties:
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          items:
            $ref: '#/components/schemas/Link'
        message:
          type: string
          example: An error has occurred.
          description: The messages indicating the cause or reason for failure.
        status:
          type: string
          example: '400'
          description: The HTTP status code for the error (same as in the HTTP response).
          enum:
          - '400'
      description: ''
    Settings:
      type: object
      properties:
        assetLinking:
          type: boolean
          example: true
          description: Whether asset linking is enabled.
        authentication:
          example: ''
          description: Details the authentication settings.
          $ref: '#/components/schemas/AuthenticationSettings'
        database:
          example: ''
          description: Details the database settings.
          $ref: '#/components/schemas/DatabaseSettings'
        directory:
          type: string
          example: /opt/rapid7/nexpose
          description: The root directory of the console.
        insightPlatform:
          type: boolean
          example: true
          description: Whether the usage of the Insight platform is enabled.
        insightPlatformRegion:
          type: string
          example: us-east-1
          description: The region used for the Insight platform, if enabled.
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          readOnly: true
          items:
            $ref: '#/components/schemas/Link'
        risk:
          example: ''
          description: Details risk configuration and settings.
          $ref: '#/components/schemas/RiskSettings'
        scan:
          example: ''
          description: Details the global settings for scanning.
          $ref: '#/components/schemas/ScanSettings'
        serialNumber:
          type: string
          example: 729F31B1C92F3C91DFA8A649F4D5C883C269BD45
          description: The console serial number.
        smtp:
          example: ''
          description: Global SMTP distribution settings.
          $ref: '#/components/schemas/SmtpSettings'
        updates:
          example: ''
          description: Details the update settings.
          $ref: '#/components/schemas/UpdateSettings'
        uuid:
          type: string
          example: 7231036a-e052-11e7-80c1-9a214cf093ae
          description: The universally unique identifier (UUID) of the console.
        web:
          example: ''
          description: Details the web server settings.
          $ref: '#/components/schemas/WebSettings'
      description: ''
    Info:
      type: object
      properties:
        cpu:
          example: ''
          description: Details regarding the host CPU.
          $ref: '#/components/schemas/CPUInfo'
        disk:
          example: ''
          description: Details regarding host disk usage.
          $ref: '#/components/schemas/DiskInfo'
        distinguishedName:
          type: string
          example: CN=Rapid7 Security Console/ O=Rapid7
          description: The distinguished name of the console.
        fqdn:
          type: string
          example: server.acme.com
          description: The fully-qualified domain name of the local host the service is running on.
        host:
          type: string
          example: SERVER
          description: The name of the local host the service is running on.
        ip:
          type: string
          example: 192.168.1.99
          description: The IP address of the local host the service is running on.
        jvm:
          example: ''
          description: Details regarding the Java Virtual Machine.
          $ref: '#/components/schemas/JVMInfo'
        links:
          type: array
          description: Hypermedia links to corresponding or related resources.
          readOnly: true
          items:
            $ref: '#/components/schemas/Link'
        memory:
          example: ''
          description: Details regarding host memory usage.
          $ref: '#/components/schemas/MemoryInfo'
        operatingSystem:
          type: string
          example: Ubuntu Linux 16.04
          description: The operating system of the host the service is running on.
        serial:
          type: string
          example: 729F31B1C92F3C91DFA8A649F4D5C883C269BD45
          description: The serial number of the console.
        superuser:
          type: boolean
          example: true
          description: Whether the service is running a super-user.
        user:
          type: string
          example: root
          description: The user running the service.
        version:
          example: ''
          description: Details regarding the version of the installation.
          $ref: '#/components/schemas/VersionInfo'
      description: ''
    DatabaseSize:
      type: object
      properties:
        bytes:
          type: integer
          format: int64
          example: 5364047843
          description: The raw value in bytes.
        formatted:
          type: string
          example: 5 GB
          description: The value formatted in human-readable notation (e.g. GB, MB, KB, bytes).
      description: ''
    RiskModifierSettings:
      type: object
      properties:
        high:
          type: number
          format: double
          example: 1.5
          description: High critical adjustment modifier.
        low:
          type: number
          format: double
          example: 0.75
          description: Low critical adjustment modifier.
        medium:
          type: number
          format: double
          example: 1.0
          description: Medium critical adjustment modifier.
        veryHigh:
          type: number
          format: double
          example: 2.0
          description: Very high critical adjustment modifier.
        veryLow:
          type: number
          format: double
          example: 0.5
          description: Very low critical adjustment modifier.
      description: ''
    DatabaseSettings:
      type: object
