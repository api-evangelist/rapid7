- aid: rapid7:rapid7-scan-configs-api
  name: Rapid7 Scan Configs API
  description: >-
    A Scan Config defines all the necessary information required to perform a Scan of an App. An App <i>must</i>
    be created prior to creating a Scan Config. It is the main document that describes <i>what</i> and
    <i>how</i> web resources should be discovered and Scanned, and can be tailored from Scan to Scan in
    order to refine the results gathered. It must define which Attack Template to use during the attacking
    phase of the Scan. Currently, all Scan Configs created via the API will by default specify that Scans
    will be executed on Cloud engines; support for On-Premise engines is available by specifying appropriate
    assignment ID (a known engine group ID), type (<code>ENGINE_GROUP</code>) and environment (<code>ON_PREMISE</code>)
    values. A Scan Config <i>must</i> define a minimum set of Options that specify the following:<ul><li>At
    least one Seed URL</li><li>At least one Crawling Scope Constraint</li></ul>If any of the Options defined
    for a Scan Config are considered invalid, an explanatory message should be included in the "errors"
    property of the owning Scan Config response body. All Seed URLs and Scope Constraint URLs provided
    must have a valid Target.
  humanURL: https://help.rapid7.com/insightvm/en-us/api/api.html
  baseURL: https://us.api.insight.rapid7.com/vm/v4
  tags:
