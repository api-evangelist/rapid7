- aid: rapid7:rapid7-targets-api
  name: Rapid7 Targets API
  description: >-
    A Target essentially specifies an allowlisted Fully Qualified Domain Name (FQDN) which can be Scanned
    by InsightAppSec. A Target can be created, edited and deleted by an API consumer provided the permissions
    inherited by the authentication method allow it, though if a Target has been successfully Scanned
    at least once it can no longer be deleted. If it is no longer desirable to allow Scans to be executed
    against a given Target, it can be disabled. A Target is a top-level resource within the product, and
    as such is not affected by the deletion of any Apps.
