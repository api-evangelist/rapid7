- aid: rapid7:rapid7-engine-groups-api
  name: Rapid7 Engine Groups API
  description: >-
    An Engine Group is a resource which defines a container for a logical grouping of Engines and therefore
    the purpose of assigning Scans to one of those Engines. Any created Engine Group can contain 0 or
    more Engines that are strictly hosted within an On-Premise environment. Any Engine which isn't assigned
    to an explicitly-defined Engine Group inherently belongs to the 'Default' Engine Group (the Default
    Engine Group cannot be explicitly created, modified, deleted or referenced, it is purely conceptual).
    Any Scans submitted which use a Scan Config with an explicit assignment to an Engine Group will follow
    the following rules:<ul><li>If the Engine Group contains only <code>OFFLINE</code> Engines, the scan
    will immediately fail</li><li>If the Engine Group contains at least 1 Engine which isn't <code>OFFLINE</code>,
    the scan will wait to be acquired</li></ul>
  humanURL: https://help.rapid7.com/insightvm/en-us/api/api.html
  baseURL: https://us.api.insight.rapid7.com/vm/v4
  tags:
  - Engine Groups
  properties:
  - type: OpenAPI
    url: openapi/rapid7-engine-groups-api-openapi.yml
- aid: rapid7:rapid7-engines-api
  name: Rapid7 Engines API
  description: >-
    An Engine encapsulates the state and high-level attributes of the components which may be installed
    and running on a specific On-Premise host. The status of an Engine is not mutable via the API; it
    reflects the platform state of the components installed on the host, and can change at any given time.
    These states are: <ul><li>INITIALIZING : Engine is starting </li> <li>IDLE : Engine is waiting for
    scans</li> <li>LICENSING : Engine is checking a License has been assigned</li> <li>SCANNING : Engine
    is currently scanning</li> <li>UPGRADING : Engine is in the process of upgrading </li> <li>FAILED
    : Engine has failed in a process, with the reason shown in failure reason</li> <li>OFFLINE :  Engine
    is not available</li> <li>TERMINATING :  Engine is in the process of being deleted</li> </ul> It should
    be noted that deleting an Engine resource is an asynchronous process, and actioning the request to
    delete the Engine occurs at the earliest convenience and is state-dependant. Creating a new Engine
    resource implicitly creates a Credential sub-resource, which is an alpha-numeric API key required
    for the successful installation and operation of an Engine in an On-Premise environment. An Engine
    API key can be retrieved by executing a <code>get-engine-credential</code> request, as documented
    below.<p> <strong> CAUTION: regenerating an API key should only be performed when there is suspicion
    that the security of the API key has been compromised; regenerating will prevent any communication
    between any client using the revoked API key and the InsightAppSec Platform. Any manual Engine maintenance
    exercise which involves running the InsightAppSec Engine installer, should result in the creation
    of a NEW Engine; an API key should never be used across installations to prevent data loss/pollution
    and runtime issues. </strong> </p> Please refer to <TODO insert link here> help documentation which
    describes the process required to update the API for an existing installation.
  humanURL: https://help.rapid7.com/insightvm/en-us/api/api.html
  baseURL: https://us.api.insight.rapid7.com/vm/v4
  tags:
  - Engines
  properties:
  - type: OpenAPI
    url: openapi/rapid7-engines-api-openapi.yml
- aid: rapid7:rapid7-files-api
  name: Rapid7 Files API
  description: >-
    Files are used primarily to manage content that can be required to successfully scan an App. For example,
    many supported methods of configuring authentication in a Scan Config require a payload and similarly
    Scan crawl configuration can be enhanced by supplying pre-populated crawl results. In order to create
    a File you will need to perform 2 steps:<ol><li>Use the <a href="#operation/create-file">Create File</a>
    API to provide the File's metadata and generate an <code>id</code> (can be derived from the <code>Location</code>
    header as described in 'Creating resources').</li><li>Use the <a href="#operation/upload-file">Upload
    File Content</a> API with the <code>id</code> returned from the previous step in order to add content
    to this File.</li></ol>Once a File is created and both steps outlined above have been successfully
    completed, then the File's <code>contentAvailable</code> property will be <code>true</code>, the File
    will be considered 'usable', and it can be referenced in specific locations of a Scan Config using
    its <code>id</code>. <br />A File's <code>type</code> can only be one of 6 options: <table> <thead><tr>
    <th>File Type</th> <th>File Extensions</th> </tr> </thead> <tbody> <tr><td><code>MACRO</code></td>
    <td><code>rec</code></td> </tr> <tr> <td><code>SWAGGER</code></td> <td><code>json</code><br/> <code>yaml</code><br/>
    <code>yml</code></td> </tr> <tr><td><code>SELENIUM</code></td> <td><code>htm</code><br/> <code>html</code><br/>
    <code>side</code></td> </tr> <tr><td><code>RECORDED_TRAFFIC</code></td> <td><code>trec</code><br/>
    <code>xml</code><br/> <code>txt</code><br/> <code>har</code><br/> <code>saz</code></td> </tr> <tr><td><code>WSDL</code></td>
    <td><code>wsdl</code></td> </tr> <tr><td><code>CERTIFICATE</code></td> <td><code>pfx</code></td> </tr>
    <tr><td><code>GRAPHQL</code></td> <td><code>qls</code><code>graphqls</code></td> </tr> <tbody> </table>Heuristic
    analysis is performed when file contents are uploaded to ensure that the content-type is appropriate
    for the file type specified; this is done for security reasons, and under no circumstances is the
    content sent to an external entity. <br />A note on security: a File can be <code>locked</code>, implying
    that it can only be modified by its owner (the original API client that created the metadata) and
    by extension only the File's owner is capable of uploading its content. If a File is <code>unlocked</code>
    any other client that has access to the File's App can make modifications, including overwriting its
    content.
  humanURL: https://help.rapid7.com/insightvm/en-us/api/api.html
  baseURL: https://us.api.insight.rapid7.com/vm/v4
  tags:
  - Files
  properties:
  - type: OpenAPI
    url: openapi/rapid7-files-api-openapi.yml
