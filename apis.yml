aid: rapid7
name: Rapid7
description: Rapid7 is a cybersecurity company providing the Insight Platform with
  products for vulnerability management (InsightVM), SIEM/XDR (InsightIDR), application
  security (InsightAppSec), cloud security (InsightCloudSec), and SOAR (InsightConnect).
  The Rapid7 Command/Insight Platform API exposes REST endpoints across regional hosts
  such as us.api.insight.rapid7.com for managing assets, vulnerabilities, investigations,
  and integrations. Authentication is performed with an organization or user API key
  passed in the `X-Api-Key` header.
