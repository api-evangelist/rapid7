- aid: rapid7:rapid7-report-api
  name: Rapid7 Report API
  description: >-
    Resources and operations for managing and generating reports. Reports are broadly categorized into
    `document`, `export`, and `file` types. `document` reports use section-based report templates to control
    the output and can be generated in several formats. `export` reports are designed to output their
    contents into a specific file format. `file` reports are templatized reports that output based on
